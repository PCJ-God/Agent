# Nginx 反向代理 —— 放到 /etc/nginx/conf.d/agent.conf
#
# Debian/Ubuntu 的 nginx.conf 里 "include /etc/nginx/conf.d/*.conf;" 位于 http {}
# 内部，所以这个文件里 limit_req_zone（http 上下文）和 server 块都能写。
#
# 改这三处：server_name、证书路径、以及（如果需要）proxy_pass 的地址。

# 按 IP 限速，兜在应用自己的「每用户每分钟 N 次」前面。
# 应用那个限流是进程内的（多 worker 下每个 worker 各算一份），
# 这一层是网关级的、跨进程生效 —— 两层互补，不是替代。
limit_req_zone $binary_remote_addr zone=agent_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name agent.example.com;

    # Let's Encrypt 的 HTTP-01 校验必须走明文
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name agent.example.com;

    ssl_certificate     /etc/letsencrypt/live/agent.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── 流式对话的关键 ──
    # 一轮协作可能跑好几分钟（多轮模型调用 + MCP 搜索），
    # 默认 60s 会在中途把连接掐掉。
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # 请求体很小（就是一句提问），但别让默认值成为隐患
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;

        # 保持 HTTP/1.1，否则 SSE 会降级成连接即断
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── SSE 必须关掉缓冲区 ──
        # 开着 proxy_buffering，Nginx 会把 /api/chat/stream 的输出攒起来，
        # 前端就变成「转圈几分钟，然后整段蹦出来」，实时性全丢。
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 同理：压缩也会引入缓冲
        gzip off;

        # 只对对话接口限速；静态资源不走这里
        limit_req zone=agent_api burst=20 nodelay;
    }

    # 静态资源可以长缓存
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1h;
    }
}
