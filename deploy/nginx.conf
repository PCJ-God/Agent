# 生产 nginx 配置：静态托管 Vue 前端 + 反代网关 API。
# 80（HTTP）与 443（HTTPS/TLS）同时对外；证书位于 /etc/nginx/certs（server.crt / server.key）。
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # SSE 流式返回关键（对话接口需要）
    proxy_buffering off;

    # 附件上传（PDF/Word/图片）放宽请求体大小
    client_max_body_size 50m;

    # Docker 内嵌 DNS：容器重建后 IP 会变，必须运行时解析，不能启动时缓存
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---------- HTTP: 80 —— ACME 验证 + 全站跳转 HTTPS ----------
    server {
        listen 80;
        server_name _;

        # Let's Encrypt HTTP-01 验证：直接读 webroot，不能重定向
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }

        # 其余一律 301 跳转到 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------- HTTPS: 443 ----------
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            set $upstream http://gateway:8080;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location = /health {
            set $upstream http://gateway:8080;
            proxy_pass $upstream;
        }

        location = /metrics {
            set $upstream http://gateway:8080;
            proxy_pass $upstream;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
