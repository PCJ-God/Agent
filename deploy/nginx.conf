# Nginx 反向代理 —— 主配置，放到 /etc/nginx/conf.d/agent.conf
#
# 配套文件 agent-locations.conf（两个 443 块共用的 location 与 TLS 参数）
# 放到 /etc/nginx/agent-locations.conf
#
# ── 为什么是两个 443 server 块 ──
# nginx 按 server_name（SNI）选择 server 块，证书是随块走的。
# 在同一个 server 块里写多个 ssl_certificate 并不能实现「按 SNI 选证书」——
# 那个写法是用来给同一个域名同时配 RSA 和 ECDSA 证书的。
# 所以「域名访问」和「纯 IP 访问」必须各占一个 server 块，各挂自己的证书。
# （这一点是实测出来的：曾经把两张证书写在同一个块里，结果域名访问
#   也拿到了 IP 证书，浏览器会报证书名称不匹配。）
#
# 换域名时改三处：两个 server 块的 server_name、两个 443 块的证书路径，
# 以及（如果代理不在本机）agent-locations.conf 里的 proxy_pass 地址。

# 按 IP 限速，兜在应用自己的「每用户每分钟 N 次」前面。
# 应用那个限流是进程内的（多 worker 下每个 worker 各算一份），
# 这一层是网关级的、跨进程生效 —— 两层互补，不是替代。
limit_req_zone $binary_remote_addr zone=agent_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name lovekiki.site www.lovekiki.site 139.155.146.41;

    # Let's Encrypt 的 HTTP-01 校验必须走明文。
    # 三个名字都写进 server_name，续期时 ACME 无论按哪个名字来都能命中。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 域名访问：挂域名证书（certbot 标准档案，90 天）──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lovekiki.site www.lovekiki.site;

    ssl_certificate     /etc/letsencrypt/live/lovekiki.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lovekiki.site/privkey.pem;

    include /etc/nginx/agent-locations.conf;
}

# ── 纯 IP 访问：挂 IP 证书 ──
# 保留它只是为了 https://139.155.146.41 这种旧书签不报证书错误。
# IP 证书走的是 shortlived 档案，只有 6 天有效期，靠 cron 自动续期
# （见 deploy/setup-nginx-cert.sh）。不需要的话整块删掉即可。
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name 139.155.146.41;

    ssl_certificate     /etc/letsencrypt/live/139.155.146.41/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/139.155.146.41/privkey.pem;

    include /etc/nginx/agent-locations.conf;
}
