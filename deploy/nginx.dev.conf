# 本地开发用 nginx 配置：静态托管 Vue 前端 + 反代网关 API。
# 生产配置见 deploy/nginx.conf（含 TLS、域名与 IP 双证书）。
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # SSE 流式返回关键（对话接口需要）
    proxy_buffering off;

    # Docker 内嵌 DNS：容器重建后 IP 会变，必须运行时解析，不能启动时缓存
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # 前端构建产物（docker-compose 挂载 frontend/dist 到这里）
        root /usr/share/nginx/html;
        index index.html;

        # API 反代到网关
        location /api/ {
            set $upstream http://gateway:8080;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Agent 多轮工具调用可能较长，放宽 SSE 读超时
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 健康检查与监控指标透传到网关
        location = /health {
            set $upstream http://gateway:8080;
            proxy_pass $upstream;
        }

        location = /metrics {
            set $upstream http://gateway:8080;
            proxy_pass $upstream;
        }

        # SPA 兜底：其余路径回退到 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
