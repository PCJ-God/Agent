# 两个 443 server 块共用的部分（证书除外）—— 放到 /etc/nginx/agent-locations.conf
#
# 为什么不放进 conf.d/：nginx.conf 里有 "include /etc/nginx/conf.d/*.conf;"，
# 那是 http 级包含；location 块只能出现在 server 块里，放错地方 nginx 直接起不来。
#
# 抽出来的理由：域名块和纯 IP 块除了证书以外完全相同，抄两份迟早改漏一份。

# ── TLS 参数 ──
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;

# ── 超时 ──
# 一轮协作可能跑好几分钟（多轮模型调用 + MCP 搜索），
# 默认 60s 会在中途把连接掐掉。
proxy_read_timeout 600s;
proxy_send_timeout 600s;

# 请求体很小（就是一句提问），但别让默认值成为隐患
client_max_body_size 1m;

location / {
    proxy_pass http://127.0.0.1:8000;

    # 保持 HTTP/1.1，否则 SSE 会降级成连接即断
    proxy_http_version 1.1;
    proxy_set_header Connection '';

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── SSE 必须关掉缓冲区 ──
    # 开着 proxy_buffering，Nginx 会把 /api/chat/stream 的输出攒起来，
    # 前端就变成「转圈几分钟，然后整段蹦出来」，实时性全丢。
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;

    # 同理：压缩也会引入缓冲
    gzip off;

    # 只对对话接口限速；静态资源不走这里
    limit_req zone=agent_api burst=20 nodelay;
}

# 静态资源可以长缓存
location /static/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    expires 1h;
}
