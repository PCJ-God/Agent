<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent 智能体系统 — Hierarchical</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
  /*
   * "夜读" — 研习空间
   *
   * 深靛蓝基底（不是终端黑），暖纸色文字（不是冷白），琥珀金 accent。
   * 色彩有温度，排版有层级，留白让内容呼吸。
   *
   * 刻意回避：
   *   - 纯黑/终端绿（那不是教学工具该有的气质）
   *   - ALL-CAPS 标签、→ 链接后缀、同圆角卡片套件（技能文档列出的反模式）
   *   - 动效泛滥：只有侧栏一次入场，其余只做 hover 微反馈
   */
  :root {
    /* ── 基底 ── */
    --bg:            #101123;
    --surface:       #181934;
    --surface-raised:#1f2042;
    --surface-hover: #252550;
    --border:        #2d2e58;
    --border-light:  #36376a;

    /* ── 文字 ── */
    --text:          #e4dece;   /* 暖纸白，不是冷白 */
    --text-emph:     #f0ebe0;
    --text-muted:    #8b886e;   /* 暖灰，不是冷灰 */

    /* ── accent ── */
    --accent:        #c4a355;   /* 琥珀金 — 台灯下的书页 */
    --accent-dim:    #9e8240;
    --green:         #5f9475;   /* 鼠尾草绿 — 不是荧光绿 */
    --red:           #c47f6e;   /* 暖调 — 不是猩红 */
    --amber:         #c99e58;

    /* ── 角色语义色 ── */
    --role-leader:   #d4a95c;   /* 调度层：暖金 */
    --role-exec:     #6ca392;   /* 执行层：青绿 */
    --role-review:   #9d82b8;   /* 审查：柔和紫 */
    --role-store:    #84806e;   /* 存储/元信息：暖灰 */

    /* ── 字体 ── */
    --serif:  'Georgia', 'Noto Serif SC', 'STSong', 'SimSun', serif;
    --sans:   'Inter', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', -apple-system, sans-serif;
    --mono:   'JetBrains Mono', 'Cascadia Code', 'SF Mono', 'Consolas', 'Courier New', monospace;

    /* ── 空间 ── */
    --radius-sm: 3px;
    --radius:    6px;
    --radius-lg: 10px;
    --sidebar-w: 220px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ═══════════════════════════════════════════
     侧栏
     ═══════════════════════════════════════════ */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    /* 唯一一处入场动效：侧栏从左边淡入 */
    animation: sidebar-in 0.5s ease-out;
  }
  @keyframes sidebar-in {
    from { opacity: 0; transform: translateX(-8px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .sidebar { animation: none; }
  }

  .sidebar-header {
    padding: 22px 18px 16px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-header h2 {
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 400;
    letter-spacing: 0.02em;
    color: var(--text-emph);
    margin-bottom: 4px;
  }
  .sidebar-header .status {
    font-size: 11px;
    color: var(--green);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .sidebar-header .status::before {
    content: '';
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--green);
  }

  .nav {
    display: flex;
    flex-direction: column;
    gap: 1px;
    padding: 10px 8px;
  }
  .nav-item {
    display: flex;
    align-items: baseline;
    gap: 9px;
    width: 100%;
    padding: 8px 10px;
    background: none;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    text-align: left;
    color: var(--text-muted);
    font-family: var(--sans);
    font-size: 13px;
    transition: background 0.12s, color 0.12s;
  }
  .nav-item:hover { background: var(--surface-hover); color: var(--text); }
  .nav-item[aria-current="true"] {
    background: var(--surface-raised);
    color: var(--text);
    box-shadow: inset 2px 0 0 var(--accent);
  }
  .nav-item .k {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--role-store);
  }

  .nav-hint {
    padding: 8px 18px 14px;
    font-size: 11px;
    line-height: 1.75;
    color: var(--text-muted);
  }

  .sidebar-footer {
    margin-top: auto;
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    font-size: 10.5px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  /* ═══════════════════════════════════════════
     主区
     ═══════════════════════════════════════════ */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .topbar {
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topbar .current-wf {
    font-family: var(--serif);
    font-size: 13px;
    font-weight: 400;
    color: var(--text-emph);
    margin-right: auto;
  }
  .icon-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 5px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 12px;
    font-family: var(--sans);
    transition: border-color 0.12s, color 0.12s;
  }
  .icon-btn:hover { border-color: var(--accent-dim); color: var(--accent); }

  .task-select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 5px 8px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-family: var(--mono);
    max-width: 240px;
    cursor: pointer;
    transition: border-color 0.12s;
  }
  .task-select:hover { border-color: var(--accent-dim); }
  .task-select option { background: #16162e; color: var(--text); }

  /* ═══════════════════════════════════════════
     对话区
     ═══════════════════════════════════════════ */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 28px;
    /* 消息居中的宽度约束 */
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  /* 消息内的滚动容器 */
  .chat-scroll {
    width: 100%;
    max-width: 680px;
  }

  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
    color: var(--text-muted);
    max-width: 440px;
    margin: 0 auto;
  }
  .welcome h1 {
    font-family: var(--serif);
    font-size: 21px;
    font-weight: 400;
    letter-spacing: 0.03em;
    color: var(--text-emph);
    margin-bottom: 10px;
  }
  .welcome p {
    font-size: 13px;
    line-height: 1.8;
  }

  /* ── 消息气泡 ── */
  .msg {
    margin-bottom: 18px;
    max-width: 680px;
    width: 100%;
  }
  .msg-role {
    font-size: 11px;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--text-muted);
    font-family: var(--mono);
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .msg-role .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  /* 用户说话和 agent 说话的视觉差异：不靠换底色，靠 dot + label 字体 */
  .msg-role.user .dot { background: var(--amber); }
  .msg-role.agent .dot { background: var(--accent-dim); }

  .msg-body {
    font-size: 14px;
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text);
  }
  .msg-body.thinking {
    color: var(--text-muted);
    font-style: italic;
    font-size: 12.5px;
  }

  /* ── Markdown 渲染后的排版 ── */
  .msg-body.rich { white-space: normal; }
  .msg-body.rich > :first-child { margin-top: 0; }
  .msg-body.rich > :last-child { margin-bottom: 0; }
  .msg-body.rich h1, .msg-body.rich h2, .msg-body.rich h3,
  .msg-body.rich h4, .msg-body.rich h5, .msg-body.rich h6 {
    margin: 20px 0 8px;
    line-height: 1.35;
    font-weight: 600;
    color: var(--text-emph);
    font-family: var(--serif);
  }
  .msg-body.rich h1 { font-size: 19px; letter-spacing: 0.02em; }
  .msg-body.rich h2 { font-size: 17px; }
  .msg-body.rich h3 { font-size: 15.5px; }
  .msg-body.rich h4, .msg-body.rich h5, .msg-body.rich h6 { font-size: 14.5px; font-family: var(--sans); }
  .msg-body.rich p { margin: 8px 0; }
  .msg-body.rich ul, .msg-body.rich ol { margin: 8px 0; padding-left: 24px; }
  .msg-body.rich li { margin: 3px 0; }
  .msg-body.rich li > ul, .msg-body.rich li > ol { margin: 3px 0; }
  .msg-body.rich strong { color: var(--text-emph); font-weight: 600; }
  .msg-body.rich a { color: var(--accent); text-decoration: none; }
  .msg-body.rich a:hover { text-decoration: underline; }
  .msg-body.rich code {
    font-family: var(--mono);
    font-size: 12.5px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 1px 6px;
  }
  .msg-body.rich pre {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    overflow-x: auto;
    margin: 10px 0;
    line-height: 1.55;
  }
  .msg-body.rich pre code {
    background: none;
    border: none;
    padding: 0;
    font-size: 12px;
  }
  .msg-body.rich blockquote {
    border-left: 3px solid var(--accent-dim);
    padding-left: 12px;
    margin: 10px 0;
    color: var(--text-muted);
    font-style: italic;
  }
  .msg-body.rich table {
    border-collapse: collapse;
    margin: 10px 0;
    font-size: 13px;
    width: 100%;
  }
  .msg-body.rich th, .msg-body.rich td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: left;
  }
  .msg-body.rich th {
    background: var(--surface-hover);
    font-weight: 600;
    color: var(--text-emph);
  }
  .msg-body.rich hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  .msg-body.rich .katex-display { margin: 10px 0; overflow-x: auto; overflow-y: hidden; }
  .msg-body.rich .katex { font-size: 1.02em; }

  /* ═══════════════════════════════════════════
     输入区
     ═══════════════════════════════════════════ */
  .input-area {
    padding: 14px 24px 18px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: center;
  }
  .input-wrap {
    width: 100%;
    max-width: 680px;
  }
  .input-box {
    display: flex;
    gap: 8px;
  }
  .input-box textarea {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 11px 14px;
    font-family: var(--sans);
    font-size: 14px;
    color: var(--text);
    resize: none;
    outline: none;
    min-height: 44px;
    max-height: 120px;
    transition: border-color 0.15s;
    line-height: 1.55;
  }
  .input-box textarea::placeholder { color: var(--text-muted); }
  .input-box textarea:focus { border-color: var(--accent-dim); }
  .send-btn {
    padding: 0 22px;
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    color: var(--bg);
    font-family: var(--sans);
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.15s;
    align-self: flex-end;
  }
  .send-btn:hover { background: var(--accent-dim); }
  .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .input-hint {
    margin-top: 6px;
    font-size: 10.5px;
    color: var(--text-muted);
    font-family: var(--mono);
    text-align: right;
  }

  /* ═══════════════════════════════════════════
     账号面板
     —— 必须高于抽屉（z-index: 60 / 61），
        否则「打开抽屉 → 想点登录」会被遮罩挡住。
     ═══════════════════════════════════════════ */
  .acct-mask {
    position: fixed;
    inset: 0;
    background: rgba(8, 8, 20, 0.65);
    z-index: 60;
  }
  .acct-panel {
    position: fixed;
    z-index: 61;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(92vw, 380px);
    background: var(--surface-raised);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: 20px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
  }
  .acct-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 14px;
    color: var(--text-emph);
  }
  .acct-close {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
  }
  .acct-close:hover { color: var(--text); }
  .acct-note {
    font-size: 12px;
    line-height: 1.75;
    color: var(--text-muted);
    margin-bottom: 14px;
  }
  .acct-note b { color: var(--text-emph); font-weight: 600; }
  .acct-field { display: block; margin-bottom: 10px; }
  .acct-field span {
    display: block;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .acct-field input {
    width: 100%;
    padding: 9px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
  }
  .acct-field input:focus { outline: none; border-color: var(--accent-dim); }
  .acct-primary {
    width: 100%;
    padding: 10px;
    cursor: pointer;
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    color: var(--bg);
    font-size: 13px;
    font-family: inherit;
    font-weight: 600;
    transition: background 0.12s;
  }
  .acct-primary:disabled { opacity: 0.5; cursor: default; }
  .acct-primary:hover:not(:disabled) { background: var(--accent-dim); }
  .acct-danger {
    width: 100%;
    padding: 10px;
    cursor: pointer;
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--red);
    font-size: 13px;
    font-family: inherit;
    transition: border-color 0.12s, background 0.12s;
  }
  .acct-danger:hover { border-color: var(--red); background: rgba(196,127,110,0.08); }
  .acct-link {
    display: block;
    width: 100%;
    margin-top: 10px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 12px;
    font-family: inherit;
    text-decoration: underline;
  }
  .acct-link:hover { color: var(--text); }
  .acct-msg {
    margin-top: 12px;
    font-size: 12px;
    line-height: 1.65;
    color: var(--text-muted);
    word-break: break-word;
  }

  /* ═══════════════════════════════════════════
     抽屉（技能 / MCP）
     —— 窄抽屉 + 醒目关闭按钮 + 底部返回链接
     ═══════════════════════════════════════════ */
  .drawer-mask {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(8, 8, 20, 0.55);
    cursor: pointer;   /* 暗示点击遮罩可关闭 */
  }
  .drawer {
    position: fixed;
    z-index: 51;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(92vw, 340px);
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-left: 1px solid var(--border-light);
    box-shadow: -8px 0 28px rgba(0, 0, 0, 0.5);
    animation: drawer-in 0.14s ease-out;
    cursor: default;   /* 抽屉内部恢复默认光标 */
  }
  /* 必须显式覆盖 hidden —— .drawer 的 display:flex 会吃掉浏览器默认的
     [hidden] { display:none }，导致 closeDrawer 设了 hidden=true 但
     抽屉依旧可见。加上 !important 确保 hidden 始终生效。 */
  .drawer[hidden],
  .drawer-mask[hidden] {
    display: none !important;
  }
  @keyframes drawer-in { from { transform: translateX(8px); opacity: 0.5; } }
  @media (prefers-reduced-motion: reduce) { .drawer { animation: none; } }

  .drawer-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--border);
  }
  .drawer-head h2 {
    font-family: var(--serif);
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.02em;
    color: var(--text-emph);
    margin: 0;
  }
  .drawer-sub {
    margin-top: 2px;
    font-size: 10.5px;
    line-height: 1.6;
    color: var(--text-muted);
  }
  .drawer-close-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 5px 10px;
    background: var(--surface-hover);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    cursor: pointer;
    font-family: var(--sans);
    font-size: 12px;
    white-space: nowrap;
    transition: border-color 0.12s, color 0.12s;
  }
  .drawer-close-btn:hover { border-color: var(--accent-dim); color: var(--text); }
  .drawer-close-btn .icon { font-size: 16px; line-height: 1; }
  .drawer-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px 20px;
  }
  /* 抽屉底部：固定在底部的返回链接 */
  .drawer-foot {
    padding: 10px 16px 14px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.5;
  }
  .drawer-foot button {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 11px;
    text-decoration: underline;
    padding: 0;
  }
  .drawer-foot button:hover { color: var(--text); }

  .sec-title {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 6px 0 10px;
    font-size: 11px;
    color: var(--text-muted);
  }
  .sec-title .n {
    font-family: var(--mono);
    color: var(--role-store);
    font-size: 10px;
  }
  .sec-title.mine { margin-top: 22px; }

  .skill-card {
    padding: 12px 14px;
    margin-bottom: 8px;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .skill-card h3 {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 2px;
    color: var(--text-emph);
  }
  .skill-card .slug {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--role-exec);
  }
  .skill-card .desc {
    margin-top: 6px;
    font-size: 12px;
    line-height: 1.7;
    color: var(--text-muted);
  }
  .skill-card .acts {
    display: flex;
    gap: 14px;
    margin-top: 10px;
    font-size: 12px;
  }
  .skill-card .acts button {
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 11.5px;
    text-decoration: underline;
  }
  .skill-card .acts button:hover { color: var(--text); }
  .skill-card .acts button.danger:hover { color: var(--red); }

  .badge {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 7px;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 9.5px;
    color: var(--role-store);
    vertical-align: middle;
  }

  .empty {
    padding: 16px 14px;
    border: 1px dashed var(--border);
    border-radius: var(--radius-sm);
    font-size: 12px;
    line-height: 1.8;
    color: var(--text-muted);
  }
  .empty b { color: var(--text); font-weight: 600; }

  .field { display: block; margin-bottom: 10px; }
  .field > span {
    display: block;
    margin-bottom: 4px;
    font-size: 11px;
    color: var(--text-muted);
  }
  .field .hint { color: var(--role-store); }
  .field input, .field textarea {
    width: 100%;
    padding: 9px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
  }
  .field textarea {
    min-height: 150px;
    resize: vertical;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.65;
  }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent-dim); }

  .row-btns { display: flex; gap: 8px; margin-top: 12px; }
  .btn-primary {
    flex: 1;
    padding: 10px;
    cursor: pointer;
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    color: var(--bg);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    transition: background 0.12s;
  }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-dim); }
  .btn-ghost {
    padding: 10px 14px;
    cursor: pointer;
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-muted);
    font-family: inherit;
    font-size: 13px;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--accent-dim); }

  .msgline { margin-top: 12px; font-size: 12px; line-height: 1.65; color: var(--text-muted); }
  .msgline.ok { color: var(--green); }
  .msgline.err { color: var(--red); }

  /* ── 响应式 ── */
  @media (max-width: 768px) {
    .sidebar { display: none; }
    .chat-area { padding: 16px; }
  }
</style>
</head>
<body>

<!-- 账号面板 -->

  <div class="drawer-head">

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

<script>
  let isRunning = false;

  function newSessionId() {
    return 'web-' + Math.random().toString(36).slice(2, 10);
  }

  let SESSION_ID = sessionStorage.getItem('agent_session_id');
  if (!SESSION_ID) {
    SESSION_ID = newSessionId();
    sessionStorage.setItem('agent_session_id', SESSION_ID);
  }

  let TOKEN = localStorage.getItem('agent_token') || '';
  let USER_ID = localStorage.getItem('agent_user_id') || '';
  let ACCOUNT = { is_anonymous: true, username: null, user_id: USER_ID };

  async function register() {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: '' })
    });
    const d = await res.json();
    TOKEN = d.token;
    USER_ID = d.user_id;
    localStorage.setItem('agent_token', TOKEN);
    localStorage.setItem('agent_user_id', USER_ID);
    return d;
  }

  async function api(path, opts = {}) {
    const o = Object.assign({}, opts);
    o.headers = Object.assign(
      {}, opts.headers, TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}
    );
    let res = await fetch(path, o);
    if (res.status === 401) {
      await register();
      o.headers.Authorization = 'Bearer ' + TOKEN;
      res = await fetch(path, o);
    }
    return res;
  }

  let mcpState = '未知';

  function renderFooter() {
    const who = ACCOUNT.username
      ? ACCOUNT.username
      : (USER_ID ? '匿名 ' + USER_ID.slice(0, 8) : '未登录');
    mcpFooter.textContent = `MCP: ${mcpState}  |  用户: ${who}  |  任务: ${SESSION_ID}`;
    acctBtn.textContent = ACCOUNT.username || '账号';
  }

  const chatArea = document.getElementById('chatArea');
  const chatScroll = document.getElementById('chatScroll');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const taskSelect = document.getElementById('taskSelect');
  const newTaskBtn = document.getElementById('newTaskBtn');
  const mcpFooter = document.getElementById('mcpFooter');
  const acctBtn = document.getElementById('acctBtn');
  const acctPanel = document.getElementById('acctPanel');
  const acctMask = document.getElementById('acctMask');
  const acctBody = document.getElementById('acctBody');
  const acctMsg = document.getElementById('acctMsg');
  const acctClose = document.getElementById('acctClose');

  renderFooter();

  api('/health').then(r => r.json()).then(d => {
    mcpState = d.mcp || '未知';
    renderFooter();
  }).catch(() => {});

  // ── 账号面板 ──
  function acctDetail(d) {
    if (!d) return '请求失败';
    if (typeof d.detail === 'string') return d.detail;
    if (Array.isArray(d.detail)) {
      return d.detail.map(x => x.msg || '').join('；') || '请求失败';
    }
    return '请求失败';
  }

  function acctField(labelText, type, autocomplete) {
    const wrap = document.createElement('label');
    wrap.className = 'acct-field';
    const span = document.createElement('span');
    span.textContent = labelText;
    const input = document.createElement('input');
    input.type = type;
    input.autocomplete = autocomplete;
    wrap.append(span, input);
    return { wrap: wrap, input: input };
  }

  function acctNote(text) {
    const p = document.createElement('p');
    p.className = 'acct-note';
    p.textContent = text;
    return p;
  }

  function renderAccount(view) {
    acctBody.textContent = '';
    acctMsg.textContent = '';
    const mode = view || (ACCOUNT.username ? 'named' : 'anon');

    if (mode === 'anon') {
      acctBody.appendChild(acctNote(
        '你现在是匿名账号 —— 打开即用，不需要注册。设置用户名和密码之后，就能在别的设备登录、看到同一份历史；已经产生的任务和历史都留在原处。'
      ));
      const u = acctField('用户名（3-32 位，字母/数字/下划线/点/横线）', 'text', 'username');
      const p = acctField('密码（至少 8 位）', 'password', 'new-password');
      const btn = document.createElement('button');
      btn.className = 'acct-primary';
      btn.textContent = '设置用户名和密码';
      btn.addEventListener('click', () => submitBind(u.input.value, p.input.value, btn));
      const link = document.createElement('button');
      link.className = 'acct-link';
      link.textContent = '我已有账号，去登录';
      link.addEventListener('click', () => renderAccount('login'));
      acctBody.append(u.wrap, p.wrap, btn, link);
      return;
    }

    if (mode === 'login') {
      acctBody.appendChild(acctNote(
        '用已有的用户名和密码登录。这台设备会切到那个账号，看到它的任务与历史。'
      ));
      const u = acctField('用户名', 'text', 'username');
      const p = acctField('密码', 'password', 'current-password');
      const btn = document.createElement('button');
      btn.className = 'acct-primary';
      btn.textContent = '登录';
      btn.addEventListener('click', () => submitLogin(u.input.value, p.input.value, btn));
      const link = document.createElement('button');
      link.className = 'acct-link';
      link.textContent = '返回';
      link.addEventListener('click', () => renderAccount());
      acctBody.append(u.wrap, p.wrap, btn, link);
      return;
    }

    const note = acctNote('已登录账号：');
    const nameEl = document.createElement('b');
    nameEl.textContent = ACCOUNT.username || '';
    note.append(nameEl, document.createTextNode(
      '。退出只会吊销这台设备的凭证，账号和历史都还在，随时能用密码重新登录。'
    ));
    acctBody.appendChild(note);

    const out = document.createElement('button');
    out.className = 'acct-danger';
    out.textContent = '退出登录（仅这台设备）';
    out.addEventListener('click', () => submitLogout(out));
    const other = document.createElement('button');
    other.className = 'acct-link';
    other.textContent = '登录到另一个账号';
    other.addEventListener('click', () => renderAccount('login'));
    acctBody.append(out, other);
  }

  function openAccount() {
    // 先关掉抽屉：两者同时打开会互相遮挡
    closeDrawer();
    renderAccount();
    acctPanel.hidden = false;
    acctMask.hidden = false;
  }

  function closeAccount() {
    acctPanel.hidden = true;
    acctMask.hidden = true;
  }

  async function switchAccount(me) {
    TOKEN = me.token;
    USER_ID = me.user_id;
    ACCOUNT = me;
    localStorage.setItem('agent_token', TOKEN);
    localStorage.setItem('agent_user_id', USER_ID);
    SESSION_ID = newSessionId();
    sessionStorage.setItem('agent_session_id', SESSION_ID);

    chatScroll.textContent = '';
    const box = document.createElement('div');
    box.className = 'welcome';
    const h1 = document.createElement('h1');
    h1.textContent = '已切换到账号 ' + (me.username || '');
    const p = document.createElement('p');
    p.textContent = '下面是该账号已有的任务历史。';
    box.append(h1, p);
    chatScroll.appendChild(box);

    renderFooter();
    await refreshTaskList();
    await loadLatestPage();
  }

  async function submitBind(username, password, btn) {
    btn.disabled = true;
    acctMsg.textContent = '正在设置…';
    try {
      const r = await fetch('/api/auth/bind', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + TOKEN
        },
        body: JSON.stringify({ username: username, password: password })
      });
      const d = await r.json();
      if (!r.ok) {
        acctMsg.textContent = '❌ ' + acctDetail(d);
        return;
      }
      ACCOUNT = d;
      renderAccount();
      acctMsg.textContent = '✅ 已设置。以后在任何设备用这个用户名密码登录，都能看到同一份历史。';
      renderFooter();
    } catch (e) {
      acctMsg.textContent = '❌ 请求失败：' + e.message;
    } finally {
      btn.disabled = false;
    }
  }

  async function submitLogin(username, password, btn) {
    btn.disabled = true;
    acctMsg.textContent = '正在登录…';
    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
      });
      const d = await r.json();
      if (!r.ok) {
        acctMsg.textContent = '❌ ' + acctDetail(d);
        return;
      }
      const who = d.username;
      await switchAccount(d);
      renderAccount();
      acctMsg.textContent = '✅ 已登录为 ' + who + '。';
    } catch (e) {
      acctMsg.textContent = '❌ 请求失败：' + e.message;
    } finally {
      btn.disabled = false;
    }
  }

  async function submitLogout(btn) {
    btn.disabled = true;
    acctMsg.textContent = '正在退出…';
    try {
      await fetch('/api/auth/logout', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + TOKEN }
      });
    } catch (e) {}
    ACCOUNT = await register();
    SESSION_ID = newSessionId();
    sessionStorage.setItem('agent_session_id', SESSION_ID);
    chatScroll.textContent = '';
    renderFooter();
    await refreshTaskList();
    renderAccount();
    acctMsg.textContent = '已退出登录，现在是新的匿名账号。';
  }

  acctBtn.addEventListener('click', openAccount);
  acctClose.addEventListener('click', closeAccount);
  acctMask.addEventListener('click', closeAccount);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !acctPanel.hidden) closeAccount();
  });

  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
  });

  function createMessage(label, { role = 'agent', thinking = false } = {}) {
    const msg = document.createElement('div');
    msg.className = 'msg';
    const roleEl = document.createElement('div');
    roleEl.className = 'msg-role ' + role;
    const dot = document.createElement('span');
    dot.className = 'dot';
    roleEl.append(dot, document.createTextNode(label));
    const body = document.createElement('div');
    body.className = 'msg-body' + (thinking ? ' thinking' : '');
    msg.append(roleEl, body);
    chatScroll.appendChild(msg);
    chatArea.scrollTop = chatArea.scrollHeight;
    return { msg, body };
  }

  function addMessage(role, content, isThinking = false) {
    const { msg, body } = createMessage(role === 'user' ? 'user' : 'Agent', {
      role, thinking: isThinking
    });
    body.textContent = content;
    return msg;
  }

  const BS = String.fromCharCode(92);
  const MATH_DELIMS = [
    ['$$', '$$', true],
    [BS + '[', BS + ']', true],
    [BS + '(', BS + ')', true],
    ['$', '$', false],
  ];

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function protectMath(text) {
    const spans = [];
    let out = '';
    let i = 0;
    outer:
    while (i < text.length) {
      for (const d of MATH_DELIMS) {
        if (!text.startsWith(d[0], i)) continue;
        const end = text.indexOf(d[1], i + d[0].length);
        if (end === -1 || (!d[2] && end - i > 200)) continue;
        spans.push(text.slice(i, end + d[1].length));
        out += '@@MATH' + (spans.length - 1) + '@@';
        i = end + d[1].length;
        continue outer;
      }
      out += text[i];
      i += 1;
    }
    return { text: out, spans };
  }

  function renderRich(el, raw) {
    if (typeof marked === 'undefined') {
      el.textContent = raw;
      return;
    }
    const { text, spans } = protectMath(raw);

    let html = marked.parse(text, { gfm: true, breaks: true });
    if (typeof DOMPurify !== 'undefined') html = DOMPurify.sanitize(html);

    const parts = html.split('@@MATH');
    if (parts.length > 1) {
      let restored = parts[0];
      for (let k = 1; k < parts.length; k++) {
        const close = parts[k].indexOf('@@');
        if (close === -1) {
          restored += '@@MATH' + parts[k];
        } else {
          const idx = parseInt(parts[k].slice(0, close), 10);
          restored += escapeHtml(spans[idx]) + parts[k].slice(close + 2);
        }
      }
      html = restored;
    }
    el.innerHTML = html;

    if (typeof renderMathInElement === 'function') {
      renderMathInElement(el, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: BS + '[', right: BS + ']', display: true },
          { left: BS + '(', right: BS + ')', display: false },
          { left: '$', right: '$', display: false },
        ],
        ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'option'],
        throwOnError: false,
      });
    }
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text || isRunning) return;

    const welcome = chatScroll.querySelector('.welcome');
    if (welcome) welcome.remove();

    addMessage('user', text);
    userInput.value = '';
    userInput.style.height = 'auto';

    isRunning = true;
    sendBtn.disabled = true;

    const thinkingEl = addMessage('agent', '思考中...', true);
    const bubbles = new Map();

    function renderNow(b) {
      if (b.timer) { clearTimeout(b.timer); b.timer = null; }
      renderRich(b.body, b.text);
      b.body.classList.add('rich');
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function renderSoon(b) {
      if (b.timer) return;
      b.timer = setTimeout(() => { b.timer = null; renderNow(b); }, 120);
    }

    function handleEvent(ev) {
      if (ev.type === 'chunk') {
        if (thinkingEl.parentNode) thinkingEl.remove();
        let b = bubbles.get(ev.id);
        if (!b) {
          b = createMessage(ev.name || 'Agent');
          b.text = '';
          b.timer = null;
          bubbles.set(ev.id, b);
        }
        b.text += ev.text;
        if (ev.last) renderNow(b); else renderSoon(b);
      } else if (ev.type === 'done') {
        if (thinkingEl.parentNode) thinkingEl.remove();
        bubbles.forEach(renderNow);
        if (bubbles.size === 0 && ev.response) {
          const m = createMessage('Agent');
          renderRich(m.body, ev.response);
          m.body.classList.add('rich');
        }
      } else if (ev.type === 'error') {
        if (thinkingEl.parentNode) thinkingEl.remove();
        addMessage('agent', '❌ ' + ev.error);
      }
    }

    try {
      const res = await api('/api/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: SESSION_ID })
      });
      if (!res.ok || !res.body) {
        const detail = await res.json().catch(() => ({}));
        throw new Error(detail.detail || ('HTTP ' + res.status));
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';

      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });

        let sep;
        while ((sep = buf.indexOf('\n\n')) >= 0) {
          const frame = buf.slice(0, sep);
          buf = buf.slice(sep + 2);
          const line = frame.split('\n').find(l => l.startsWith('data:'));
          if (!line) continue;
          try {
            handleEvent(JSON.parse(line.slice(5).trim()));
          } catch (e) { /* 忽略坏帧 */ }
        }
      }
    } catch (err) {
      if (thinkingEl.parentNode) thinkingEl.remove();
      addMessage('agent', '❌ ' + err.message);
    } finally {
      if (thinkingEl.parentNode) thinkingEl.remove();
      isRunning = false;
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  userInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // ── 任务（会话）与历史 ──
  const PAGE_SIZE = 20;
  let historyCursor = null;
  let loadingOlder = false;

  function showWelcome() {
    chatScroll.innerHTML = `
      <div class="welcome">
        <h1>智能教学助手</h1>
        <p>直接在下面提问。左侧「技能」可以把你自己的做法写成技能，Agent 需要时会自己去读。</p>
      </div>`;
  }

  function appendTurn(role, content) {
    const isUser = role === 'user';
    const { msg, body } = createMessage(isUser ? 'user' : 'Agent', {
      role: isUser ? 'user' : 'agent'
    });
    renderRich(body, content);
    body.classList.add('rich');
    return msg;
  }

  async function loadLatestPage() {
    try {
      const r = await api(`/api/sessions/${encodeURIComponent(SESSION_ID)}/messages?limit=${PAGE_SIZE}`);
      const d = await r.json();
      chatScroll.innerHTML = '';
      if (!d.messages || d.messages.length === 0) {
        showWelcome();
      } else {
        d.messages.forEach(m => appendTurn(m.role, m.content));
      }
      historyCursor = d.next_cursor;
      chatArea.scrollTop = chatArea.scrollHeight;
    } catch (e) {}
  }

  async function loadOlderPage() {
    if (loadingOlder || historyCursor === null) return;
    loadingOlder = true;
    const before = historyCursor;
    const prevHeight = chatArea.scrollHeight;
    try {
      const r = await api(
        `/api/sessions/${encodeURIComponent(SESSION_ID)}/messages`
        + `?limit=${PAGE_SIZE}&before=${before}`
      );
      const d = await r.json();
      const els = (d.messages || []).map(m => appendTurn(m.role, m.content));
      els.reverse().forEach(el => chatScroll.prepend(el));
      historyCursor = d.next_cursor;
      chatArea.scrollTop += chatArea.scrollHeight - prevHeight;
    } catch (e) {} finally {
      loadingOlder = false;
    }
  }

  async function refreshTaskList() {
    try {
      const r = await api('/api/sessions');
      const list = await r.json();
      taskSelect.innerHTML = '';
      const seen = new Set();
      if (!list.some(s => s.session_id === SESSION_ID)) {
        const opt = document.createElement('option');
        opt.value = SESSION_ID;
        opt.textContent = `${SESSION_ID}（当前，暂无历史）`;
        taskSelect.appendChild(opt);
        seen.add(SESSION_ID);
      }
      list.forEach(s => {
        if (seen.has(s.session_id)) return;
        const opt = document.createElement('option');
        opt.value = s.session_id;
        opt.textContent = `${s.title || s.session_id} · ${s.messages} 条`;
        taskSelect.appendChild(opt);
      });
      taskSelect.value = SESSION_ID;
    } catch (e) {}
  }

  function switchTask(sessionId) {
    if (!sessionId) return;
    SESSION_ID = sessionId;
    sessionStorage.setItem('agent_session_id', sessionId);
    renderFooter();
    historyCursor = null;
    loadLatestPage();
  }

  taskSelect.addEventListener('change', () => switchTask(taskSelect.value));
  chatArea.addEventListener('scroll', () => {
    if (chatArea.scrollTop < 40) loadOlderPage();
  });

  newTaskBtn.addEventListener('click', async () => {
    try {
      const r = await api('/api/sessions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: '新任务' })
      });
      const s = await r.json();
      switchTask(s.id);
      await refreshTaskList();
    } catch (e) {
      addMessage('agent', '❌ 新建任务失败: ' + e.message);
    }
  });

  (async () => {
    try {
      if (!TOKEN) {
        ACCOUNT = await register();
      } else {
        const r = await fetch('/api/auth/me', {
          headers: { Authorization: 'Bearer ' + TOKEN }
        });
        if (r.ok) {
          ACCOUNT = await r.json();
          USER_ID = ACCOUNT.user_id;
          localStorage.setItem('agent_user_id', USER_ID);
        } else if (r.status === 401) {
          ACCOUNT = await register();
        }
      }
    } catch (e) {}
    renderFooter();
    await refreshTaskList();
    await loadLatestPage();
  })();

  // ── 扩展抽屉：技能管理 ──
  const drawer = document.getElementById('drawer');
  const drawerMask = document.getElementById('drawerMask');
  const drawerBody = document.getElementById('drawerBody');
  const drawerTitle = document.getElementById('drawerTitle');
  const drawerSub = document.getElementById('drawerSub');
  const drawerCloseBtn = document.getElementById('drawerCloseBtn');
  const drawerReturnBtn = document.getElementById('drawerReturnBtn');
  const navChat = document.getElementById('navChat');
  const navSkills = document.getElementById('navSkills');
  const navMcp = document.getElementById('navMcp');
  const navSkillsCount = document.getElementById('navSkillsCount');
  const navMcpState = document.getElementById('navMcpState');

  const SKILLS_SUB =
    '正文不进模型上下文：Agent 只看到名字和描述，决定要用时才自己去读它。';
  const MCP_SUB = '外部工具是 Agent 的手，配好之后它才调得到。';

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function msgLine(text, kind) {
    return el('div', 'msgline' + (kind ? ' ' + kind : ''), text);
  }

  function navSet(active) {
    [navChat, navSkills, navMcp].forEach((b) => {
      if (b) b.setAttribute('aria-current', b === active ? 'true' : 'false');
    });
  }

  function field(label, kind, hint) {
    const wrap = el('label', 'field');
    const cap = el('span', null, label);
    if (hint) cap.appendChild(el('span', 'hint', ' · ' + hint));
    const input = document.createElement(kind === 'area' ? 'textarea' : 'input');
    wrap.append(cap, input);
    return { wrap, input };
  }

  function skillCard(s, editable) {
    const card = el('div', 'skill-card');
    const h = el('h3', null, s.name || s.slug);
    if (!editable) h.appendChild(el('span', 'badge', '内置'));
    card.appendChild(h);
    card.appendChild(el('div', 'slug', s.slug));
    if (s.description) card.appendChild(el('div', 'desc', s.description));
    if (editable) {
      const acts = el('div', 'acts');
      const bEdit = el('button', null, '编辑');
      bEdit.addEventListener('click', () => renderSkillForm(s));
      const bDel = el('button', 'danger', '删除');
      bDel.addEventListener('click', () => confirmDelete(s, card));
      acts.append(bEdit, bDel);
      card.appendChild(acts);
    }
    return card;
  }

  async function renderSkills() {
    drawerBody.textContent = '';
    drawerBody.appendChild(msgLine('正在读取技能…'));

    let list;
    try {
      const r = await api('/api/skills');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      list = await r.json();
    } catch (e) {
      drawerBody.textContent = '';
      drawerBody.appendChild(
        msgLine('没读到技能列表（' + e.message + '）。检查网络后点左侧「技能」重试。', 'err')
      );
      return;
    }

    const builtin = list.filter((s) => s.builtin);
    const mine = list.filter((s) => !s.builtin);
    if (navSkillsCount) navSkillsCount.textContent = mine.length ? String(mine.length) : '';

    drawerBody.textContent = '';

    const t1 = el('div', 'sec-title');
    t1.append(el('span', null, '内置技能'), el('span', 'n', String(builtin.length)));
    drawerBody.appendChild(t1);
    builtin.forEach((s) => drawerBody.appendChild(skillCard(s, false)));

    const t2 = el('div', 'sec-title mine');
    t2.append(el('span', null, '我的技能'), el('span', 'n', String(mine.length)));
    drawerBody.appendChild(t2);

    if (mine.length === 0) {
      const empty = el('div', 'empty');
      empty.append(
        el('b', null, '还没有自定义技能。'),
        document.createTextNode(
          '写下"什么时候该用、按什么步骤做"，比如你们团队的评审标准、简历的写法。Agent 需要时会自己读到它。'
        )
      );
      drawerBody.appendChild(empty);
    } else {
      mine.forEach((s) => drawerBody.appendChild(skillCard(s, true)));
    }

    const add = el('button', 'btn-primary', '新建技能');
    add.addEventListener('click', () => renderSkillForm(null));
    drawerBody.appendChild(add);
  }

  function renderSkillForm(existing) {
    const isNew = !existing;
    drawerBody.textContent = '';
    drawerBody.appendChild(
      msgLine(
        isNew
          ? '写清「什么时候该用、怎么做」。描述是 Agent 唯一能看到的线索，别写太泛。'
          : '改了立刻生效，不用重启服务 —— 下一次提问就带上新版本。'
      )
    );

    const fSlug = field('目录名', 'input', isNew ? '小写字母/数字/横线，建好后不可改' : '不可修改');
    fSlug.input.value = isNew ? '' : existing.slug;
    fSlug.input.disabled = !isNew;
    fSlug.input.placeholder = 'team-review';

    const fName = field('名称', 'input');
    fName.input.value = isNew ? '' : existing.name || '';
    fName.input.placeholder = '团队评审标准';

    const fDesc = field('描述', 'input', 'Agent 靠这句话判断该不该用');
    fDesc.input.value = isNew ? '' : existing.description || '';
    fDesc.input.placeholder = '写简历或方案时用来对照的检查清单';

    const fBody = field('正文', 'area', 'Markdown，模型按需读取');
    fBody.input.value = isNew ? '' : existing.body || '';
    fBody.input.placeholder = '## 什么时候用\n…\n## 检查清单\n- …';

    const msg = el('div', 'msgline');
    const save = el('button', 'btn-primary', isNew ? '创建' : '保存');
    save.addEventListener('click', () => submitSkillForm(existing, save, msg, {
      slug: fSlug, name: fName, desc: fDesc, body: fBody,
    }));
    const cancel = el('button', 'btn-ghost', '返回列表');
    cancel.addEventListener('click', () => renderSkills());
    const btns = el('div', 'row-btns');
    btns.append(save, cancel);

    drawerBody.append(fSlug.wrap, fName.wrap, fDesc.wrap, fBody.wrap, btns, msg);
  }

  async function submitSkillForm(existing, btn, msg, f) {
    btn.disabled = true;
    msg.className = 'msgline';
    msg.textContent = '保存中…';
    try {
      const r = existing
        ? await api('/api/skills/' + encodeURIComponent(existing.skill_id), {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: f.name.input.value.trim(),
              description: f.desc.input.value.trim(),
              body: f.body.input.value,
            }),
          })
        : await api('/api/skills', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              slug: f.slug.input.value.trim(),
              name: f.name.input.value.trim(),
              description: f.desc.input.value.trim(),
              body: f.body.input.value,
            }),
          });
      if (!r.ok) {
        const d = await r.json().catch(() => ({}));
        const detail = Array.isArray(d.detail)
          ? d.detail.map((x) => x.msg || '').join('；')
          : d.detail;
        throw new Error(detail || 'HTTP ' + r.status);
      }
      await renderSkills();
      drawerBody.insertBefore(
        msgLine('已保存，下一次提问就会用上。', 'ok'),
        drawerBody.firstChild
      );
    } catch (e) {
      msg.className = 'msgline err';
      msg.textContent = '没保存成功：' + e.message;
      btn.disabled = false;
    }
  }

  function confirmDelete(s, card) {
    const acts = card.querySelector('.acts');
    if (!acts) return;
    acts.textContent = '';
    const ask = el('span', 'desc', '删掉「' + (s.name || s.slug) + '」？');
    const yes = el('button', 'danger', '确认删除');
    const no = el('button', null, '取消');
    yes.addEventListener('click', async () => {
      yes.disabled = true;
      try {
        const r = await api('/api/skills/' + encodeURIComponent(s.skill_id), {
          method: 'DELETE',
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        await renderSkills();
        drawerBody.insertBefore(
          msgLine('已删除。下一次提问就不再带这个技能了。', 'ok'),
          drawerBody.firstChild
        );
      } catch (e) {
        yes.disabled = false;
        acts.textContent = '';
        acts.appendChild(el('span', 'desc', '没删掉：' + e.message));
      }
    });
    no.addEventListener('click', () => renderSkills());
    acts.append(ask, yes, no);
  }

  const MCP_STATE_TEXT = {
    connected: '已连通',
    unreachable: '连不上',
    unavailable: '未配置',
  };

  async function renderMcp() {
    drawerBody.textContent = '';
    drawerBody.appendChild(msgLine('正在实测连通性…'));

    let d;
    try {
      const r = await api('/api/mcp');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      d = await r.json();
    } catch (e) {
      drawerBody.textContent = '';
      drawerBody.appendChild(
        msgLine('没读到 MCP 状态（' + e.message + '）。检查网络后点左侧「MCP 服务」重试。', 'err')
      );
      return;
    }

    drawerBody.textContent = '';

    const t = el('div', 'sec-title');
    t.append(el('span', null, '实测状态'), el('span', 'n', MCP_STATE_TEXT[d.status] || d.status));
    drawerBody.appendChild(t);

    const card = el('div', 'skill-card');
    card.appendChild(el('h3', null, d.name || '（未配置服务）'));
    const where = [d.transport, d.host].filter(Boolean).join(' · ');
    if (where) card.appendChild(el('div', 'slug', where));
    card.appendChild(
      el(
        'div',
        'desc',
        d.status === 'connected'
          ? '连得上，Agent 能调用下面这些工具。'
          : d.status === 'unreachable'
            ? '连不上，Agent 会降级成「只有技能和内置工具」。原因：' + (d.detail || '未知')
            : '没有配置 MCP 服务，目前只有技能和内置工具可用。'
      )
    );
    drawerBody.appendChild(card);

    const t2 = el('div', 'sec-title mine');
    t2.append(el('span', null, '可用工具'), el('span', 'n', String((d.tools || []).length)));
    drawerBody.appendChild(t2);
    if (!d.tools || d.tools.length === 0) {
      drawerBody.appendChild(msgLine('没有取到工具。'));
    } else {
      d.tools.forEach((name) => {
        const c = el('div', 'skill-card');
        c.appendChild(el('h3', null, name));
        drawerBody.appendChild(c);
      });
    }

    const note = el('div', 'empty');
    note.append(
      el('b', null, '这里是只读的：'),
      document.createTextNode(
        '现在的 MCP 服务是部署时配好的（' +
          (d.name ? d.name + '，' : '') +
          '地址和密钥都只在服务端）。要支持自己添加 MCP 服务器，得先定两件事：' +
          '谁能加（影响加到谁的账号下）、密钥存在哪里 —— 那等于允许 Agent ' +
          '向你填的任意地址发请求，不该顺手打开。'
      )
    );
    drawerBody.appendChild(note);
  }

  function openDrawer(tab) {
    // 先关掉账号面板：两者同时打开会互相遮挡
    closeAccount();
    drawer.hidden = false;
    drawerMask.hidden = false;
    drawer.setAttribute('aria-hidden', 'false');
    if (tab === 'mcp') {
      drawerTitle.textContent = 'MCP 服务';
      drawerSub.textContent = MCP_SUB;
      navSet(navMcp);
      renderMcp();
    } else {
      drawerTitle.textContent = '技能';
      drawerSub.textContent = SKILLS_SUB;
      navSet(navSkills);
      renderSkills();
    }
  }

  function closeDrawer() {
    drawer.hidden = true;
    drawerMask.hidden = true;
    drawer.setAttribute('aria-hidden', 'true');
    navSet(navChat);
  }

  navChat.addEventListener('click', () => {
    closeDrawer();
    navSet(navChat);
  });
  navSkills.addEventListener('click', () => openDrawer('skills'));
  navMcp.addEventListener('click', () => openDrawer('mcp'));
  drawerCloseBtn.addEventListener('click', closeDrawer);
  drawerReturnBtn.addEventListener('click', closeDrawer);
  drawerMask.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !drawer.hidden) closeDrawer();
  });
  navSet(navChat);

  api('/health')
    .then((r) => r.json())
    .then((d) => {
      mcpState = d.mcp || mcpState;
      if (navMcpState) navMcpState.textContent = mcpState;
    })
    .catch(() => {});
</script>
</body>
</html>
