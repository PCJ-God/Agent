<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent 智能体系统 — Hierarchical</title>
<!-- 数学公式样式 (KaTeX)，渲染脚本在页面底部引入 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
  :root {
    --bg: #0c0c14;
    --surface: #14141f;
    --surface-hover: #1c1c2a;
    --border: #2a2a3a;
    --border-active: #4a9eff;
    --text: #e0e0e8;
    --text-muted: #7a7a90;
    --accent: #4a9eff;
    --green: #34d399;
    --red: #f87171;
    --amber: #f59e0b;
    --mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    --sans: 'Inter', -apple-system, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  .sidebar {
    width: 260px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar-header {
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-header h2 {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .sidebar-header .status {
    font-size: 11px;
    color: var(--green);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .sidebar-header .status::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
  }
  .arch-info {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  .arch-layer {
    padding: 8px 12px;
    margin-bottom: 4px;
    border-radius: 4px;
    font-size: 11px;
    font-family: var(--mono);
    border-left: 3px solid var(--border-active);
    background: rgba(74,158,255,0.05);
  }
  .arch-layer .label { color: var(--accent); }
  .arch-layer .desc { color: var(--text-muted); }
  .sidebar-footer {
    margin-top: auto;
    padding: 12px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
  }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .topbar {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar .current-wf {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
  }
  .topbar .mcp-status {
    font-size: 11px;
    color: var(--text-muted);
    font-family: var(--mono);
  }
  .icon-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    font-family: var(--mono);
    transition: all 0.15s;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

  .task-select {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 5px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-family: var(--mono);
    max-width: 240px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .task-select:hover { border-color: var(--accent); color: var(--accent); }
  .task-select option { background: #16161a; color: #e6e6e6; }
  .task-empty { font-size: 11px; color: var(--text-muted); font-family: var(--mono); }

  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
    color: var(--text-muted);
  }
  .welcome h1 {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
  }
  .welcome p { font-size: 13px; max-width: 420px; line-height: 1.6; }

  .msg { margin-bottom: 20px; max-width: 720px; margin-left: auto; margin-right: auto; }
  .msg-role {
    font-family: var(--mono);
    font-size: 11px;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .msg-role.user { color: var(--amber); }
  .msg-role.agent { color: var(--accent); }
  .msg-role.user .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }
  .msg-role.agent .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .msg-body {
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg-body.thinking { color: var(--text-muted); font-style: italic; font-size: 12px; }

  /* Agent 输出经 marked 渲染后的排版 */
  .msg-body.rich { white-space: normal; }
  .msg-body.rich > :first-child { margin-top: 0; }
  .msg-body.rich > :last-child { margin-bottom: 0; }
  .msg-body.rich h1, .msg-body.rich h2, .msg-body.rich h3,
  .msg-body.rich h4, .msg-body.rich h5, .msg-body.rich h6 {
    margin: 18px 0 8px;
    line-height: 1.4;
    font-weight: 600;
    color: #fff;
  }
  .msg-body.rich h1 { font-size: 19px; }
  .msg-body.rich h2 { font-size: 17px; }
  .msg-body.rich h3 { font-size: 15.5px; }
  .msg-body.rich h4 { font-size: 14.5px; }
  .msg-body.rich h5, .msg-body.rich h6 { font-size: 14px; }
  .msg-body.rich p { margin: 8px 0; }
  .msg-body.rich ul, .msg-body.rich ol { margin: 8px 0; padding-left: 26px; }
  .msg-body.rich li { margin: 4px 0; }
  .msg-body.rich li > ul, .msg-body.rich li > ol { margin: 4px 0; }
  .msg-body.rich strong { color: #fff; font-weight: 600; }
  .msg-body.rich a { color: var(--accent); }
  .msg-body.rich code {
    font-family: var(--mono);
    font-size: 12.5px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
  }
  .msg-body.rich pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    overflow-x: auto;
    margin: 10px 0;
  }
  .msg-body.rich pre code { background: none; border: none; padding: 0; }
  .msg-body.rich blockquote {
    border-left: 3px solid var(--border-active);
    padding-left: 12px;
    margin: 8px 0;
    color: var(--text-muted);
  }
  .msg-body.rich table { border-collapse: collapse; margin: 10px 0; font-size: 13px; }
  .msg-body.rich th, .msg-body.rich td {
    border: 1px solid var(--border);
    padding: 5px 10px;
    text-align: left;
  }
  .msg-body.rich th { background: var(--surface-hover); font-weight: 600; }
  .msg-body.rich hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  /* 块级公式可能很宽，允许横向滚动而不是把气泡撑破 */
  .msg-body.rich .katex-display { margin: 10px 0; overflow-x: auto; overflow-y: hidden; }
  .msg-body.rich .katex { font-size: 1.02em; }

  .input-area {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
  }
  .input-box {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
  }
  .input-box textarea {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    font-family: var(--sans);
    font-size: 14px;
    color: var(--text);
    resize: none;
    outline: none;
    min-height: 44px;
    max-height: 120px;
    transition: border-color 0.15s;
  }
  .input-box textarea:focus { border-color: var(--accent); }
  .send-btn {
    padding: 0 20px;
    background: var(--accent);
    border: none;
    border-radius: 6px;
    color: #fff;
    font-family: var(--mono);
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.15s;
  }
  .send-btn:hover { background: #3a8eef; }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .input-hint {
    max-width: 720px;
    margin: 8px auto 0;
    font-size: 11px;
    color: var(--text-muted);
    font-family: var(--mono);
  }
  @media (max-width: 768px) { .sidebar { display: none; } }

  /* ── 账号面板 ── */
  .acct-mask {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 40;
  }
  .acct-panel {
    position: fixed;
    z-index: 41;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(92vw, 380px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
  }
  .acct-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .acct-close {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
  }
  .acct-close:hover { color: var(--text); }
  .acct-note {
    font-size: 12px;
    line-height: 1.7;
    color: var(--text-muted);
    margin-bottom: 14px;
  }
  .acct-field { display: block; margin-bottom: 10px; }
  .acct-field span {
    display: block;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .acct-field input {
    width: 100%;
    padding: 9px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
  }
  .acct-field input:focus { outline: none; border-color: var(--accent); }
  .acct-primary {
    width: 100%;
    padding: 10px;
    cursor: pointer;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 13px;
    font-family: inherit;
  }
  .acct-primary:disabled { opacity: 0.6; cursor: default; }
  .acct-danger {
    width: 100%;
    padding: 10px;
    cursor: pointer;
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--red);
    font-size: 13px;
    font-family: inherit;
  }
  .acct-danger:hover { border-color: var(--red); }
  .acct-link {
    display: block;
    width: 100%;
    margin-top: 10px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 12px;
    font-family: inherit;
    text-decoration: underline;
  }
  .acct-link:hover { color: var(--text); }
  .acct-msg {
    margin-top: 12px;
    font-size: 12px;
    line-height: 1.6;
    color: var(--text-muted);
    word-break: break-word;
  }
  /* ── 导航 + 抽屉（扩展功能）──────────────────────────────
     设计取向：这是「一台正在协作的机器的控制台」，不是聊天工具。
     所以：
       · 侧栏从静态架构说明改成**真导航**（那四行说明原本占着最贵的位置）
       · 新功能用**抽屉**而不是新页面 —— 管工具时不该丢掉对话上下文
       · 角色色是**有语义的**（这条信息是谁产出的），不是装饰
       · 空状态是"邀请行动"，报错说清发生了什么、怎么修，不空泛
     ──────────────────────────────────────────────────────── */
  :root {
    --role-leader: #e0a458;   /* 调度层：Leader */
    --role-exec: #6fb3a8;     /* 执行层：Researcher */
    --role-review: #b48ead;   /* 审查：Reviewer */
    --role-store: #7d8590;    /* 存储层 / 元信息 */
  }

  .nav { display: flex; flex-direction: column; gap: 2px; padding: 10px; }
  .nav-item {
    display: flex; align-items: baseline; gap: 10px;
    width: 100%; padding: 9px 10px;
    background: none; border: none; border-radius: 6px;
    cursor: pointer; text-align: left;
    color: var(--text-muted);
    font-family: var(--sans); font-size: 13px;
  }
  .nav-item:hover { background: var(--surface-hover); color: var(--text); }
  .nav-item[aria-current="true"] {
    background: var(--surface-hover); color: var(--text);
    box-shadow: inset 2px 0 0 var(--accent);
  }
  .nav-item .k { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--role-store); }
  .nav-hint {
    padding: 2px 20px 12px;
    font-size: 11px; line-height: 1.7; color: var(--text-muted);
  }
  .role-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; }
  .role-dot.leader { background: var(--role-leader); }
  .role-dot.exec   { background: var(--role-exec); }
  .role-dot.review { background: var(--role-review); }

  /* ── 抽屉 ── */
  .drawer-mask {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0, 0, 0, 0.5);
  }
  .drawer {
    position: fixed; z-index: 51; top: 0; right: 0; bottom: 0;
    width: min(94vw, 460px);
    display: flex; flex-direction: column;
    background: var(--surface);
    border-left: 1px solid var(--border);
    box-shadow: -20px 0 50px rgba(0, 0, 0, 0.45);
    animation: drawer-in 0.18s ease-out;
  }
  @keyframes drawer-in { from { transform: translateX(14px); opacity: 0.4; } }
  @media (prefers-reduced-motion: reduce) {
    .drawer { animation: none; }
  }
  .drawer-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    padding: 18px 18px 12px;
    border-bottom: 1px solid var(--border);
  }
  .drawer-head h2 { font-size: 15px; font-weight: 600; }
  .drawer-sub { margin-top: 4px; font-size: 11px; line-height: 1.6; color: var(--text-muted); }
  .x-btn {
    background: none; border: none; cursor: pointer;
    color: var(--text-muted); font-size: 20px; line-height: 1;
  }
  .x-btn:hover { color: var(--text); }
  .drawer-body { flex: 1; overflow-y: auto; padding: 16px 18px 28px; }

  .sec-title {
    display: flex; align-items: baseline; gap: 8px;
    margin: 4px 0 10px;
    font-size: 11px; color: var(--text-muted);
  }
  .sec-title .n { font-family: var(--mono); color: var(--role-store); }
  .sec-title.mine { margin-top: 22px; }

  .skill-card {
    padding: 12px 13px; margin-bottom: 8px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  }
  .skill-card h3 { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
  .skill-card .slug { font-family: var(--mono); font-size: 10px; color: var(--role-exec); }
  .skill-card .desc { margin-top: 6px; font-size: 12px; line-height: 1.6; color: var(--text-muted); }
  .skill-card .acts { display: flex; gap: 12px; margin-top: 10px; font-size: 12px; }
  .skill-card .acts button {
    background: none; border: none; cursor: pointer; padding: 0;
    color: var(--text-muted); font-family: inherit; font-size: 12px;
    text-decoration: underline;
  }
  .skill-card .acts button:hover { color: var(--text); }
  .skill-card .acts button.danger:hover { color: var(--red); }
  .badge {
    display: inline-block; margin-left: 6px; padding: 1px 6px;
    border: 1px solid var(--border); border-radius: 999px;
    font-size: 10px; color: var(--role-store);
  }

  .empty {
    padding: 18px 14px;
    border: 1px dashed var(--border); border-radius: 8px;
    font-size: 12px; line-height: 1.8; color: var(--text-muted);
  }
  .empty b { color: var(--text); font-weight: 600; }

  .field { display: block; margin-bottom: 10px; }
  .field > span { display: block; margin-bottom: 4px; font-size: 11px; color: var(--text-muted); }
  .field .hint { color: var(--role-store); }
  .field input, .field textarea {
    width: 100%; padding: 9px 10px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-family: var(--sans); font-size: 13px;
  }
  .field textarea { min-height: 150px; resize: vertical; font-family: var(--mono); font-size: 12px; line-height: 1.6; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }

  .row-btns { display: flex; gap: 8px; margin-top: 12px; }
  .btn-primary {
    flex: 1; padding: 10px; cursor: pointer;
    background: var(--accent); border: none; border-radius: 6px;
    color: #fff; font-family: inherit; font-size: 13px;
  }
  .btn-primary:disabled { opacity: 0.6; cursor: default; }
  .btn-ghost {
    padding: 10px 14px; cursor: pointer;
    background: none; border: 1px solid var(--border); border-radius: 6px;
    color: var(--text-muted); font-family: inherit; font-size: 13px;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--accent); }

  .msgline { margin-top: 12px; font-size: 12px; line-height: 1.6; color: var(--text-muted); }
  .msgline.ok { color: var(--green); }
  .msgline.err { color: var(--red); }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-header">
    <h2>Agent 系统</h2>
    <div class="status">Hierarchical 层级协作</div>
  </div>
  <!-- 侧栏是真导航，不再是架构说明。角色点用语义色，后面消息气泡会复用同一套。 -->
  <nav class="nav">
    <button class="nav-item" id="navChat" aria-current="true">
      <span class="role-dot exec"></span><span>对话</span>
    </button>
    <button class="nav-item" id="navSkills" data-tab="skills">
      <span class="role-dot leader"></span><span>技能</span>
      <span class="k" id="navSkillsCount"></span>
    </button>
    <button class="nav-item" id="navMcp" data-tab="mcp">
      <span class="role-dot review"></span><span>MCP 服务</span>
      <span class="k" id="navMcpState"></span>
    </button>
  </nav>
  <div class="nav-hint">
    技能是你能直接改的那一层：Agent 只按名字和描述判断该不该用，
    决定要用时才会自己去读正文。
  </div>
  <div class="sidebar-footer" id="mcpFooter">MCP: 连接中...</div>
</aside>

<main class="main">
  <div class="topbar">
    <span class="current-wf">Hierarchical 层级协作</span>
    <select class="task-select" id="taskSelect" title="切换任务（会话）"></select>
    <button class="icon-btn" id="newTaskBtn">新建任务</button>
    <button class="icon-btn" id="acctBtn" title="账号设置 / 登录">账号</button>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="welcome">
      <h1>Agent 智能体系统</h1>
      <p>直接在下面提问。左侧「技能」可以把你自己的做法写成技能，Agent 需要时会自己去读。</p>
    </div>
  </div>

  <div class="input-area">
    <div class="input-box">
      <textarea id="userInput" placeholder="输入你的问题..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn">发送</button>
    </div>
    <div class="input-hint">Enter 发送 · Shift+Enter 换行</div>
  </div>
</main>

<!-- 账号面板：匿名账号在这里设置用户名密码（历史原地保留）；
     已绑定账号可以退出当前设备，或用密码登录到另一个账号。 -->
<div class="acct-mask" id="acctMask" hidden></div>
<div class="acct-panel" id="acctPanel" hidden>
  <div class="acct-head">
    <span>账号</span>
    <button class="acct-close" id="acctClose" title="关闭">&times;</button>
  </div>
  <div id="acctBody"></div>
  <div class="acct-msg" id="acctMsg"></div>
</div>

<!-- 扩展抽屉：技能管理（MCP 随后）。用抽屉而不是新页面 —— 管工具时不该丢掉对话上下文。 -->
<div class="drawer-mask" id="drawerMask" hidden></div>
<aside class="drawer" id="drawer" hidden>
  <div class="drawer-head">
    <div>
      <h2 id="drawerTitle">技能</h2>
      <p class="drawer-sub" id="drawerSub"></p>
    </div>
    <button class="x-btn" id="drawerClose" title="关闭">&times;</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<!-- 渲染依赖 (jsdelivr): Markdown / XSS 消毒 / LaTeX 公式 -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

<script>
  let isRunning = false;

  function newSessionId() {
    return 'web-' + Math.random().toString(36).slice(2, 10);
  }

  // 任务 ID：每个标签页一个。用 sessionStorage 是为了刷新后仍是同一个任务，
  // 而新标签页/新窗口则是新任务。后端再按 (用户, 任务) 两层隔离。
  let SESSION_ID = sessionStorage.getItem('agent_session_id');
  if (!SESSION_ID) {
    SESSION_ID = newSessionId();
    sessionStorage.setItem('agent_session_id', SESSION_ID);
  }

  // 凭证：存在 localStorage（同浏览器共享，刷新/换标签页都还在）。
  // 没有就先匿名注册（打开即用，不需要填任何东西）；之后可以绑定用户名密码，
  // 或者用已有的用户名密码登录到别的账号。
  let TOKEN = localStorage.getItem('agent_token') || '';
  let USER_ID = localStorage.getItem('agent_user_id') || '';
  // 账号信息（是否已绑定用户名密码）。**必须在 renderFooter() 第一次被调用之前
  // 声明** —— renderFooter 会读它，而它是 let，声明写晚了就是又一次 TDZ 崩溃，
  // 顶层异常会打断整个脚本，症状是「打字但发送没反应」。
  let ACCOUNT = { is_anonymous: true, username: null, user_id: USER_ID };

  async function register() {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: '' })
    });
    const d = await res.json();
    TOKEN = d.token;
    USER_ID = d.user_id;
    localStorage.setItem('agent_token', TOKEN);
    localStorage.setItem('agent_user_id', USER_ID);
    return d;
  }

  // 统一请求入口：自动带凭证；token 失效（401）就重新注册再重试一次。
  async function api(path, opts = {}) {
    const o = Object.assign({}, opts);
    o.headers = Object.assign(
      {}, opts.headers, TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}
    );
    let res = await fetch(path, o);
    if (res.status === 401) {
      await register();
      o.headers.Authorization = 'Bearer ' + TOKEN;
      res = await fetch(path, o);
    }
    return res;
  }

  let mcpState = '未知';

  function renderFooter() {
    const who = ACCOUNT.username
      ? ACCOUNT.username
      : (USER_ID ? '匿名 ' + USER_ID.slice(0, 8) : '未登录');
    mcpFooter.textContent = `MCP: ${mcpState}  |  用户: ${who}  |  任务: ${SESSION_ID}`;
    acctBtn.textContent = ACCOUNT.username || '账号';
  }
  // 下面这些 const 必须先声明。mcpFooter 是 const，存在暂时性死区(TDZ)：
  // 若在这之前调用 renderFooter()，会抛
  //   "Cannot access 'mcpFooter' before initialization"
  // 而这句位于内联脚本顶层 —— 异常会中断整个脚本，
  // 导致后面的 sendBtn.addEventListener / Enter 键监听全部绑不上，
  // 症状就是「在输入框里打字，但点发送和回车都没反应」。
  const chatArea = document.getElementById('chatArea');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const taskSelect = document.getElementById('taskSelect');
  const newTaskBtn = document.getElementById('newTaskBtn');
  const mcpFooter = document.getElementById('mcpFooter');
  const acctBtn = document.getElementById('acctBtn');
  const acctPanel = document.getElementById('acctPanel');
  const acctMask = document.getElementById('acctMask');
  const acctBody = document.getElementById('acctBody');
  const acctMsg = document.getElementById('acctMsg');
  const acctClose = document.getElementById('acctClose');

  renderFooter();

  // 获取 MCP 状态
  api('/health').then(r => r.json()).then(d => {
    mcpState = d.mcp || '未知';
    renderFooter();
  }).catch(() => {});

  // ── 账号面板 ──
  // 三个视图：anon（匿名 → 设置用户名密码）/ named（已绑定 → 退出或换号）
  // / login（登录已有账号）。
  function acctDetail(d) {
    // FastAPI 的错误体是 {"detail": "..."}；校验失败时 detail 是数组
    if (!d) return '请求失败';
    if (typeof d.detail === 'string') return d.detail;
    if (Array.isArray(d.detail)) {
      return d.detail.map(x => x.msg || '').join('；') || '请求失败';
    }
    return '请求失败';
  }

  function acctField(labelText, type, autocomplete) {
    const wrap = document.createElement('label');
    wrap.className = 'acct-field';
    const span = document.createElement('span');
    span.textContent = labelText;
    const input = document.createElement('input');
    input.type = type;
    input.autocomplete = autocomplete;
    wrap.append(span, input);
    return { wrap: wrap, input: input };
  }

  function acctNote(text) {
    const p = document.createElement('p');
    p.className = 'acct-note';
    p.textContent = text;
    return p;
  }

  function renderAccount(view) {
    acctBody.textContent = '';
    acctMsg.textContent = '';
    const mode = view || (ACCOUNT.username ? 'named' : 'anon');

    if (mode === 'anon') {
      acctBody.appendChild(acctNote(
        '你现在是匿名账号 —— 打开即用，不需要注册。设置用户名和密码之后，'
        + '就能在别的设备登录、看到同一份历史；已经产生的任务和历史都留在原处。'
      ));
      const u = acctField('用户名（3-32 位，字母/数字/下划线/点/横线）', 'text', 'username');
      const p = acctField('密码（至少 8 位）', 'password', 'new-password');
      const btn = document.createElement('button');
      btn.className = 'acct-primary';
      btn.textContent = '设置用户名和密码';
      btn.addEventListener('click', () => submitBind(u.input.value, p.input.value, btn));
      const link = document.createElement('button');
      link.className = 'acct-link';
      link.textContent = '我已有账号，去登录';
      link.addEventListener('click', () => renderAccount('login'));
      acctBody.append(u.wrap, p.wrap, btn, link);
      return;
    }

    if (mode === 'login') {
      acctBody.appendChild(acctNote(
        '用已有的用户名和密码登录。这台设备会切到那个账号，看到它的任务与历史。'
      ));
      const u = acctField('用户名', 'text', 'username');
      const p = acctField('密码', 'password', 'current-password');
      const btn = document.createElement('button');
      btn.className = 'acct-primary';
      btn.textContent = '登录';
      btn.addEventListener('click', () => submitLogin(u.input.value, p.input.value, btn));
      const link = document.createElement('button');
      link.className = 'acct-link';
      link.textContent = '返回';
      link.addEventListener('click', () => renderAccount());
      acctBody.append(u.wrap, p.wrap, btn, link);
      return;
    }

    const note = acctNote('已登录账号：');
    const nameEl = document.createElement('b');
    nameEl.textContent = ACCOUNT.username || '';
    note.append(nameEl, document.createTextNode(
      '。退出只会吊销这台设备的凭证，账号和历史都还在，随时能用密码重新登录。'
    ));
    acctBody.appendChild(note);

    const out = document.createElement('button');
    out.className = 'acct-danger';
    out.textContent = '退出登录（仅这台设备）';
    out.addEventListener('click', () => submitLogout(out));
    const other = document.createElement('button');
    other.className = 'acct-link';
    other.textContent = '用另一个账号登录';
    other.addEventListener('click', () => renderAccount('login'));
    acctBody.append(out, other);
  }

  function openAccount() {
    renderAccount();
    acctPanel.hidden = false;
    acctMask.hidden = false;
  }

  function closeAccount() {
    acctPanel.hidden = true;
    acctMask.hidden = true;
  }

  // 换账号：换凭证，清掉当前任务与聊天区，再载入新账号的任务列表。
  // 不换 SESSION_ID 的话会把上一个账号的任务 ID 带到新账号名下。
  async function switchAccount(me) {
    TOKEN = me.token;
    USER_ID = me.user_id;
    ACCOUNT = me;
    localStorage.setItem('agent_token', TOKEN);
    localStorage.setItem('agent_user_id', USER_ID);
    SESSION_ID = newSessionId();
    sessionStorage.setItem('agent_session_id', SESSION_ID);

    chatArea.textContent = '';
    const box = document.createElement('div');
    box.className = 'welcome';
    const h1 = document.createElement('h1');
    h1.textContent = '已切换到账号 ' + (me.username || '');
    const p = document.createElement('p');
    p.textContent = '下面是该账号已有的任务历史。';
    box.append(h1, p);
    chatArea.appendChild(box);

    renderFooter();
    await refreshTaskList();
    await loadLatestPage();
  }

  async function submitBind(username, password, btn) {
    btn.disabled = true;
    acctMsg.textContent = '正在设置…';
    try {
      const r = await fetch('/api/auth/bind', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + TOKEN
        },
        body: JSON.stringify({ username: username, password: password })
      });
      const d = await r.json();
      if (!r.ok) {
        acctMsg.textContent = '❌ ' + acctDetail(d);
        return;
      }
      ACCOUNT = d;
      renderAccount();
      acctMsg.textContent = '✅ 已设置。以后在任何设备用这个用户名密码登录，都能看到同一份历史。';
      renderFooter();
    } catch (e) {
      acctMsg.textContent = '❌ 请求失败：' + e.message;
    } finally {
      btn.disabled = false;
    }
  }

  async function submitLogin(username, password, btn) {
    btn.disabled = true;
    acctMsg.textContent = '正在登录…';
    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
      });
      const d = await r.json();
      if (!r.ok) {
        acctMsg.textContent = '❌ ' + acctDetail(d);
        return;
      }
      const who = d.username;
      await switchAccount(d);
      renderAccount();
      acctMsg.textContent = '✅ 已登录为 ' + who + '。';
    } catch (e) {
      acctMsg.textContent = '❌ 请求失败：' + e.message;
    } finally {
      btn.disabled = false;
    }
  }

  async function submitLogout(btn) {
    btn.disabled = true;
    acctMsg.textContent = '正在退出…';
    try {
      await fetch('/api/auth/logout', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + TOKEN }
      });
    } catch (e) {
      // 网络失败也继续往下走：本地凭证照清，别卡在"看起来还登着"的状态
    }
    // 退出后回到匿名（新开一个匿名账号），这样不注册也能接着用
    ACCOUNT = await register();
    SESSION_ID = newSessionId();
    sessionStorage.setItem('agent_session_id', SESSION_ID);
    chatArea.textContent = '';
    renderFooter();
    await refreshTaskList();
    renderAccount();
    acctMsg.textContent = '已退出登录，现在是新的匿名账号。';
  }

  acctBtn.addEventListener('click', openAccount);
  acctClose.addEventListener('click', closeAccount);
  acctMask.addEventListener('click', closeAccount);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !acctPanel.hidden) closeAccount();
  });

  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
  });

  // 建立消息气泡，返回 { msg, body }。
  // 一律用 textContent 写入，避免模型输出里的 HTML 被当作标记执行 (XSS)。
  function createMessage(label, { role = 'agent', thinking = false } = {}) {
    const msg = document.createElement('div');
    msg.className = 'msg';
    const roleEl = document.createElement('div');
    roleEl.className = 'msg-role ' + role;
    const dot = document.createElement('span');
    dot.className = 'dot';
    roleEl.append(dot, document.createTextNode(label));
    const body = document.createElement('div');
    body.className = 'msg-body' + (thinking ? ' thinking' : '');
    msg.append(roleEl, body);
    chatArea.appendChild(msg);
    chatArea.scrollTop = chatArea.scrollHeight;
    return { msg, body };
  }

  function addMessage(role, content, isThinking = false) {
    const { msg, body } = createMessage(role === 'user' ? 'user' : 'Agent', {
      role, thinking: isThinking
    });
    body.textContent = content;
    return msg;
  }

  const BS = String.fromCharCode(92);   // 反斜杠
  // 数学定界符: [开始, 结束, 是否块级]。用 BS 拼接而不是写反斜杠字面量，
  // 避免源码里出现成片的 "\\[" "\\(" 转义。
  const MATH_DELIMS = [
    ['$$', '$$', true],
    [BS + '[', BS + ']', true],
    [BS + '(', BS + ')', true],
    ['$', '$', false],
  ];

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // 把数学片段摘出来换成占位符。
  // 必须先摘: marked 会把 \{ \} \dots 当作 Markdown 转义吃掉，
  // 公式里的花括号就画不出来了。
  function protectMath(text) {
    const spans = [];
    let out = '';
    let i = 0;
    outer:
    while (i < text.length) {
      for (const d of MATH_DELIMS) {
        if (!text.startsWith(d[0], i)) continue;
        const end = text.indexOf(d[1], i + d[0].length);
        // 行内公式限制长度，避免一个孤立的 $ 把大段正文吞进公式
        if (end === -1 || (!d[2] && end - i > 200)) continue;
        spans.push(text.slice(i, end + d[1].length));
        out += '@@MATH' + (spans.length - 1) + '@@';
        i = end + d[1].length;
        continue outer;
      }
      out += text[i];
      i += 1;
    }
    return { text: out, spans };
  }

  // Agent 输出是 Markdown + LaTeX。渲染管线:
  //   1. 摘出数学片段 → 2. marked 渲染 Markdown → 3. DOMPurify 消毒
  //   → 4. 还原公式 → 5. KaTeX 排版
  // 第 3 步不能省: marked 会原样保留内联 HTML，直接 innerHTML 就是 XSS。
  function renderRich(el, raw) {
    if (typeof marked === 'undefined') {
      el.textContent = raw;   // CDN 没加载成功时退化为纯文本
      return;
    }
    const { text, spans } = protectMath(raw);

    let html = marked.parse(text, { gfm: true, breaks: true });
    if (typeof DOMPurify !== 'undefined') html = DOMPurify.sanitize(html);

    // 用 split 还原占位符（不用正则，省掉转义）
    const parts = html.split('@@MATH');
    if (parts.length > 1) {
      let restored = parts[0];
      for (let k = 1; k < parts.length; k++) {
        const close = parts[k].indexOf('@@');
        if (close === -1) {
          restored += '@@MATH' + parts[k];
        } else {
          const idx = parseInt(parts[k].slice(0, close), 10);
          restored += escapeHtml(spans[idx]) + parts[k].slice(close + 2);
        }
      }
      html = restored;
    }
    el.innerHTML = html;

    if (typeof renderMathInElement === 'function') {
      renderMathInElement(el, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: BS + '[', right: BS + ']', display: true },
          { left: BS + '(', right: BS + ')', display: false },
          { left: '$', right: '$', display: false },
        ],
        ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'option'],
        throwOnError: false,
      });
    }
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text || isRunning) return;

    const welcome = chatArea.querySelector('.welcome');
    if (welcome) welcome.remove();

    addMessage('user', text);
    userInput.value = '';
    userInput.style.height = 'auto';

    isRunning = true;
    sendBtn.disabled = true;

    const thinkingEl = addMessage('agent', '思考中...', true);
    const bubbles = new Map();   // 后端 msg.id -> 气泡

    function renderNow(b) {
      if (b.timer) { clearTimeout(b.timer); b.timer = null; }
      renderRich(b.body, b.text);
      b.body.classList.add('rich');
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    // 流式期间约每 120ms 才重排一次；每个字符都跑一遍 marked+KaTeX 会卡
    function renderSoon(b) {
      if (b.timer) return;
      b.timer = setTimeout(() => { b.timer = null; renderNow(b); }, 120);
    }

    function handleEvent(ev) {
      if (ev.type === 'chunk') {
        if (thinkingEl.parentNode) thinkingEl.remove();
        let b = bubbles.get(ev.id);
        if (!b) {
          b = createMessage(ev.name || 'Agent');
          b.text = '';
          b.timer = null;
          bubbles.set(ev.id, b);
        }
        b.text += ev.text;
        // last=true 表示该条消息的最后一个分片，立刻出终版
        if (ev.last) renderNow(b); else renderSoon(b);
      } else if (ev.type === 'done') {
        if (thinkingEl.parentNode) thinkingEl.remove();
        bubbles.forEach(renderNow);
        // 兜底：万一一个分片都没收到，就把最终答案直接渲染出来
        if (bubbles.size === 0 && ev.response) {
          const m = createMessage('Agent');
          renderRich(m.body, ev.response);
          m.body.classList.add('rich');
        }
      } else if (ev.type === 'error') {
        if (thinkingEl.parentNode) thinkingEl.remove();
        addMessage('agent', '❌ ' + ev.error);
      }
    }

    try {
      const res = await api('/api/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: SESSION_ID })
      });
      if (!res.ok || !res.body) {
        const detail = await res.json().catch(() => ({}));
        throw new Error(detail.detail || ('HTTP ' + res.status));
      }

      // 逐块读取 SSE 流：后端每产出一段文本就立刻渲染到对应气泡
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';

      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });

        let sep;
        while ((sep = buf.indexOf('\n\n')) >= 0) {
          const frame = buf.slice(0, sep);
          buf = buf.slice(sep + 2);
          const line = frame.split('\n').find(l => l.startsWith('data:'));
          if (!line) continue;
          try {
            handleEvent(JSON.parse(line.slice(5).trim()));
          } catch (e) { /* 忽略坏帧 */ }
        }
      }
    } catch (err) {
      if (thinkingEl.parentNode) thinkingEl.remove();
      addMessage('agent', '❌ ' + err.message);
    } finally {
      if (thinkingEl.parentNode) thinkingEl.remove();
      isRunning = false;
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  userInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  // ── 任务（会话）与历史 ──
  const PAGE_SIZE = 20;
  let historyCursor = null;      // 更早历史的游标；null = 已经到头
  let loadingOlder = false;

  function showWelcome() {
    chatArea.innerHTML = `
      <div class="welcome">
        <h1>Agent 智能体系统</h1>
        <p>直接在下面提问。左侧「技能」可以把你自己的做法写成技能，Agent 需要时会自己去读。</p>
      </div>`;
  }

  // 造一条对话气泡并追加到末尾，返回该元素
  function appendTurn(role, content) {
    const isUser = role === 'user';
    const { msg, body } = createMessage(isUser ? 'user' : 'Agent', {
      role: isUser ? 'user' : 'agent'
    });
    renderRich(body, content);
    body.classList.add('rich');
    return msg;
  }

  // 打开任务：取最新一页历史
  async function loadLatestPage() {
    try {
      const r = await api(`/api/sessions/${encodeURIComponent(SESSION_ID)}/messages?limit=${PAGE_SIZE}`);
      const d = await r.json();
      chatArea.innerHTML = '';
      if (!d.messages || d.messages.length === 0) {
        showWelcome();
      } else {
        d.messages.forEach(m => appendTurn(m.role, m.content));
      }
      historyCursor = d.next_cursor;
      chatArea.scrollTop = chatArea.scrollHeight;
    } catch (e) { /* 历史加载失败不阻塞继续对话 */ }
  }

  // 向上翻找历史：再取一页插到最前面，并把视口钉在原处
  async function loadOlderPage() {
    if (loadingOlder || historyCursor === null) return;
    loadingOlder = true;
    const before = historyCursor;
    const prevHeight = chatArea.scrollHeight;
    try {
      const r = await api(
        `/api/sessions/${encodeURIComponent(SESSION_ID)}/messages`
        + `?limit=${PAGE_SIZE}&before=${before}`
      );
      const d = await r.json();
      // appendTurn 会追加到末尾，所以创建完再倒序插到最前，恢复时间正序
      const els = (d.messages || []).map(m => appendTurn(m.role, m.content));
      els.reverse().forEach(el => chatArea.prepend(el));
      historyCursor = d.next_cursor;
      chatArea.scrollTop += chatArea.scrollHeight - prevHeight;
    } catch (e) { /* 忽略 */ } finally {
      loadingOlder = false;
    }
  }

  async function refreshTaskList() {
    try {
      const r = await api('/api/sessions');
      const list = await r.json();
      taskSelect.innerHTML = '';
      const seen = new Set();
      if (!list.some(s => s.session_id === SESSION_ID)) {
        const opt = document.createElement('option');
        opt.value = SESSION_ID;
        opt.textContent = `${SESSION_ID}（当前，暂无历史）`;
        taskSelect.appendChild(opt);
        seen.add(SESSION_ID);
      }
      list.forEach(s => {
        if (seen.has(s.session_id)) return;
        const opt = document.createElement('option');
        opt.value = s.session_id;
        opt.textContent = `${s.title || s.session_id} · ${s.messages} 条`;
        taskSelect.appendChild(opt);
      });
      taskSelect.value = SESSION_ID;
    } catch (e) { /* 忽略 */ }
  }

  function switchTask(sessionId) {
    if (!sessionId) return;
    SESSION_ID = sessionId;
    sessionStorage.setItem('agent_session_id', sessionId);
    renderFooter();
    historyCursor = null;
    loadLatestPage();
  }

  taskSelect.addEventListener('change', () => switchTask(taskSelect.value));
  // 上滑到顶 → 自动加载更早的一页
  chatArea.addEventListener('scroll', () => {
    if (chatArea.scrollTop < 40) loadOlderPage();
  });

  newTaskBtn.addEventListener('click', async () => {
    try {
      const r = await api('/api/sessions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: '新任务' })
      });
      const s = await r.json();
      switchTask(s.id);
      await refreshTaskList();
    } catch (e) {
      addMessage('agent', '❌ 新建任务失败: ' + e.message);
    }
  });

  // 启动：先确保有凭证，再列出任务、载入当前任务的历史
  (async () => {
    try {
      if (!TOKEN) {
        ACCOUNT = await register();
      } else {
        // 已有 token：校验一次，失效就重新注册
        const r = await fetch('/api/auth/me', {
          headers: { Authorization: 'Bearer ' + TOKEN }
        });
        if (r.ok) {
          ACCOUNT = await r.json();
          USER_ID = ACCOUNT.user_id;
          localStorage.setItem('agent_user_id', USER_ID);
        } else if (r.status === 401) {
          ACCOUNT = await register();
        }
      }
    } catch (e) { /* 下面两个请求失败时也会暴露问题 */ }
    renderFooter();
    await refreshTaskList();
    await loadLatestPage();
  })();

  // ── 扩展抽屉：技能管理 ──────────────────────────────────────────────
  // 追加在脚本末尾（启动 IIFE 之后）是刻意的：上面所有 const 都已初始化，
  // 不会踩到前面注释里说的那种 TDZ 崩溃。
  //
  // 语义：技能存在服务端库里，磁盘上的 SKILL.md 只是给 Agent 读的物化视图。
  // 增删改之后服务端会让该用户的缓存团队失效 → **下一次提问就生效**，
  // 所以界面就这么写，别说成"要重启服务"。
  //
  // 注意 agent 只拿到名字和描述，正文要它自己调 read_skill_file 去读 ——
  // 所以"描述"这一栏决定技能会不会被用上，值得写清楚。
  const drawer = document.getElementById('drawer');
  const drawerMask = document.getElementById('drawerMask');
  const drawerBody = document.getElementById('drawerBody');
  const drawerTitle = document.getElementById('drawerTitle');
  const drawerSub = document.getElementById('drawerSub');
  const drawerClose = document.getElementById('drawerClose');
  const navChat = document.getElementById('navChat');
  const navSkills = document.getElementById('navSkills');
  const navMcp = document.getElementById('navMcp');
  const navSkillsCount = document.getElementById('navSkillsCount');
  const navMcpState = document.getElementById('navMcpState');

  const SKILLS_SUB =
    '正文不进模型上下文：Agent 只看到名字和描述，决定要用时才自己去读它。';
  const MCP_SUB = '外部工具是 Agent 的手，配好之后它才调得到。';

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function msgLine(text, kind) {
    return el('div', 'msgline' + (kind ? ' ' + kind : ''), text);
  }

  // 侧栏高亮：抽屉关掉时回到"对话"，因为对话一直在后面
  function navSet(active) {
    [navChat, navSkills, navMcp].forEach((b) => {
      if (b) b.setAttribute('aria-current', b === active ? 'true' : 'false');
    });
  }

  function field(label, kind, hint) {
    const wrap = el('label', 'field');
    const cap = el('span', null, label);
    if (hint) cap.appendChild(el('span', 'hint', ' · ' + hint));
    const input = document.createElement(kind === 'area' ? 'textarea' : 'input');
    wrap.append(cap, input);
    return { wrap, input };
  }

  function skillCard(s, editable) {
    const card = el('div', 'skill-card');
    const h = el('h3', null, s.name || s.slug);
    if (!editable) h.appendChild(el('span', 'badge', '内置'));
    card.appendChild(h);
    card.appendChild(el('div', 'slug', s.slug));
    if (s.description) card.appendChild(el('div', 'desc', s.description));
    if (editable) {
      const acts = el('div', 'acts');
      const bEdit = el('button', null, '编辑');
      bEdit.addEventListener('click', () => renderSkillForm(s));
      const bDel = el('button', 'danger', '删除');
      bDel.addEventListener('click', () => confirmDelete(s, card));
      acts.append(bEdit, bDel);
      card.appendChild(acts);
    }
    return card;
  }

  async function renderSkills() {
    drawerBody.textContent = '';
    drawerBody.appendChild(msgLine('正在读取技能…'));

    let list;
    try {
      const r = await api('/api/skills');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      list = await r.json();
    } catch (e) {
      drawerBody.textContent = '';
      drawerBody.appendChild(
        msgLine('没读到技能列表（' + e.message + '）。检查网络后点左侧「技能」重试。', 'err')
      );
      return;
    }

    const builtin = list.filter((s) => s.builtin);
    const mine = list.filter((s) => !s.builtin);
    if (navSkillsCount) navSkillsCount.textContent = mine.length ? String(mine.length) : '';

    drawerBody.textContent = '';

    const t1 = el('div', 'sec-title');
    t1.append(el('span', null, '内置技能'), el('span', 'n', String(builtin.length)));
    drawerBody.appendChild(t1);
    builtin.forEach((s) => drawerBody.appendChild(skillCard(s, false)));

    const t2 = el('div', 'sec-title mine');
    t2.append(el('span', null, '我的技能'), el('span', 'n', String(mine.length)));
    drawerBody.appendChild(t2);

    if (mine.length === 0) {
      const empty = el('div', 'empty');
      empty.append(
        el('b', null, '还没有自定义技能。'),
        document.createTextNode(
          '写下"什么时候该用、按什么步骤做"，比如你们团队的评审标准、简历的写法。' +
            'Agent 需要时会自己读到它。'
        )
      );
      drawerBody.appendChild(empty);
    } else {
      mine.forEach((s) => drawerBody.appendChild(skillCard(s, true)));
    }

    const add = el('button', 'btn-primary', '新建技能');
    add.addEventListener('click', () => renderSkillForm(null));
    drawerBody.appendChild(add);
  }

  function renderSkillForm(existing) {
    const isNew = !existing;
    drawerBody.textContent = '';
    drawerBody.appendChild(
      msgLine(
        isNew
          ? '写清「什么时候该用、怎么做」。描述是 Agent 唯一能看到的线索，别写太泛。'
          : '改了立刻生效，不用重启服务 —— 下一次提问就带上新版本。'
      )
    );

    const fSlug = field('目录名', 'input', isNew ? '小写字母/数字/横线，建好后不可改' : '不可修改');
    fSlug.input.value = isNew ? '' : existing.slug;
    fSlug.input.disabled = !isNew;
    fSlug.input.placeholder = 'team-review';

    const fName = field('名称', 'input');
    fName.input.value = isNew ? '' : existing.name || '';
    fName.input.placeholder = '团队评审标准';

    const fDesc = field('描述', 'input', 'Agent 靠这句话判断该不该用');
    fDesc.input.value = isNew ? '' : existing.description || '';
    fDesc.input.placeholder = '写简历或方案时用来对照的检查清单';

    const fBody = field('正文', 'area', 'Markdown，模型按需读取');
    fBody.input.value = isNew ? '' : existing.body || '';
    fBody.input.placeholder = '## 什么时候用\n…\n## 检查清单\n- …';

    const msg = el('div', 'msgline');
    const save = el('button', 'btn-primary', isNew ? '创建' : '保存');
    save.addEventListener('click', () => submitSkillForm(existing, save, msg, {
      slug: fSlug, name: fName, desc: fDesc, body: fBody,
    }));
    const cancel = el('button', 'btn-ghost', '返回列表');
    cancel.addEventListener('click', () => renderSkills());
    const btns = el('div', 'row-btns');
    btns.append(save, cancel);

    drawerBody.append(fSlug.wrap, fName.wrap, fDesc.wrap, fBody.wrap, btns, msg);
  }

  async function submitSkillForm(existing, btn, msg, f) {
    btn.disabled = true;
    msg.className = 'msgline';
    msg.textContent = '保存中…';
    try {
      const r = existing
        ? await api('/api/skills/' + encodeURIComponent(existing.skill_id), {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: f.name.input.value.trim(),
              description: f.desc.input.value.trim(),
              body: f.body.input.value,
            }),
          })
        : await api('/api/skills', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              slug: f.slug.input.value.trim(),
              name: f.name.input.value.trim(),
              description: f.desc.input.value.trim(),
              body: f.body.input.value,
            }),
          });
      if (!r.ok) {
        // FastAPI 的校验错误 detail 是数组，得挑出 msg
        const d = await r.json().catch(() => ({}));
        const detail = Array.isArray(d.detail)
          ? d.detail.map((x) => x.msg || '').join('；')
          : d.detail;
        throw new Error(detail || 'HTTP ' + r.status);
      }
      await renderSkills();
      // renderSkills 重建了列表，所以结果行重新插到最上面
      drawerBody.insertBefore(
        msgLine('已保存，下一次提问就会用上。', 'ok'),
        drawerBody.firstChild
      );
    } catch (e) {
      msg.className = 'msgline err';
      msg.textContent = '没保存成功：' + e.message;
      btn.disabled = false;
    }
  }

  // 两步确认，不用原生 confirm：它会打断页面，也没法把后果说清楚
  function confirmDelete(s, card) {
    const acts = card.querySelector('.acts');
    if (!acts) return;
    acts.textContent = '';
    const ask = el('span', 'desc', '删掉「' + (s.name || s.slug) + '」？');
    const yes = el('button', 'danger', '确认删除');
    const no = el('button', null, '取消');
    yes.addEventListener('click', async () => {
      yes.disabled = true;
      try {
        const r = await api('/api/skills/' + encodeURIComponent(s.skill_id), {
          method: 'DELETE',
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        await renderSkills();
        drawerBody.insertBefore(
          msgLine('已删除。下一次提问就不再带这个技能了。', 'ok'),
          drawerBody.firstChild
        );
      } catch (e) {
        yes.disabled = false;
        acts.textContent = '';
        acts.appendChild(el('span', 'desc', '没删掉：' + e.message));
      }
    });
    no.addEventListener('click', () => renderSkills());
    acts.append(ask, yes, no);
  }

  const MCP_STATE_TEXT = {
    connected: '已连通',
    unreachable: '连不上',
    unavailable: '未配置',
  };

  async function renderMcp() {
    drawerBody.textContent = '';
    drawerBody.appendChild(msgLine('正在实测连通性…'));

    let d;
    try {
      const r = await api('/api/mcp');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      d = await r.json();
    } catch (e) {
      drawerBody.textContent = '';
      drawerBody.appendChild(
        msgLine('没读到 MCP 状态（' + e.message + '）。检查网络后点左侧「MCP 服务」重试。', 'err')
      );
      return;
    }

    drawerBody.textContent = '';

    const t = el('div', 'sec-title');
    t.append(el('span', null, '实测状态'), el('span', 'n', MCP_STATE_TEXT[d.status] || d.status));
    drawerBody.appendChild(t);

    const card = el('div', 'skill-card');
    card.appendChild(el('h3', null, d.name || '（未配置服务）'));
    const where = [d.transport, d.host].filter(Boolean).join(' · ');
    if (where) card.appendChild(el('div', 'slug', where));
    card.appendChild(
      el(
        'div',
        'desc',
        d.status === 'connected'
          ? '连得上，Agent 能调用下面这些工具。'
          : d.status === 'unreachable'
            ? '连不上，Agent 会降级成「只有技能和内置工具」。原因：' + (d.detail || '未知')
            : '没有配置 MCP 服务，目前只有技能和内置工具可用。'
      )
    );
    drawerBody.appendChild(card);

    const t2 = el('div', 'sec-title mine');
    t2.append(el('span', null, '可用工具'), el('span', 'n', String((d.tools || []).length)));
    drawerBody.appendChild(t2);
    if (!d.tools || d.tools.length === 0) {
      drawerBody.appendChild(msgLine('没有取到工具。'));
    } else {
      d.tools.forEach((name) => {
        const c = el('div', 'skill-card');
        c.appendChild(el('h3', null, name));
        drawerBody.appendChild(c);
      });
    }

    // 把"为什么这里是只读的"讲清楚，而不是留一个没有下文的占位
    const note = el('div', 'empty');
    note.append(
      el('b', null, '这里是只读的：'),
      document.createTextNode(
        '现在的 MCP 是服务端配置文件里写死的一个远程服务（' +
          (d.name ? d.name + '，' : '') +
          '地址和密钥都只在服务端）。要支持自己添加 MCP 服务器，得先定两件事：' +
          '谁能加（影响加到谁的账号下）、密钥存在哪里 —— 那等于允许 Agent ' +
          '向你填的任意地址发请求，不该顺手打开。'
      )
    );
    drawerBody.appendChild(note);
  }

  function openDrawer(tab) {
    drawer.hidden = false;
    drawerMask.hidden = false;
    drawer.setAttribute('aria-hidden', 'false');
    if (tab === 'mcp') {
      drawerTitle.textContent = 'MCP 服务';
      drawerSub.textContent = MCP_SUB;
      navSet(navMcp);
      renderMcp();
    } else {
      drawerTitle.textContent = '技能';
      drawerSub.textContent = SKILLS_SUB;
      navSet(navSkills);
      renderSkills();
    }
  }

  function closeDrawer() {
    drawer.hidden = true;
    drawerMask.hidden = true;
    drawer.setAttribute('aria-hidden', 'true');
    navSet(navChat); // 关掉抽屉就是回到对话
  }

  navChat.addEventListener('click', () => {
    closeDrawer();
    navSet(navChat);
  });
  navSkills.addEventListener('click', () => openDrawer('skills'));
  navMcp.addEventListener('click', () => openDrawer('mcp'));
  drawerClose.addEventListener('click', closeDrawer);
  drawerMask.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !drawer.hidden) closeDrawer();
  });
  navSet(navChat);

  // 侧栏顺带显示 MCP 状态（健康检查那条是启动时发的，这里再确认一次口径一致）
  api('/health')
    .then((r) => r.json())
    .then((d) => {
      mcpState = d.mcp || mcpState;
      if (navMcpState) navMcpState.textContent = mcpState;
    })
    .catch(() => {});
</script>
</body>
</html>
