# ACP Copilot — 全栈 Docker Compose
#
# 目标服务器：2 vCPU / 4 GiB / 50 GiB（整栈内存约 2.9 GiB，留约 1 GiB 余量）
# 启动：docker compose up -d
#
# 架构：
#   前端(nginx 静态) ──/api──▶ gateway(Go) ──gRPC──▶ ai-engine(Python AgentScope)
#                                  │  ▲                    │
#                                  │  └── Redis 限流/黑名单  ├── LlamaIndex+Qdrant(课程库)
#                                  ▼                        └── mem0+Qdrant(长期记忆)
#                            MinIO + RabbitMQ ──▶ ai-worker(异步解析 docx/pdf/OCR)

services:
  # ─────────────────── 接入层：Go 网关（自建） ───────────────────
  gateway:
    build: ./gateway
    image: acp-gateway
    container_name: acp-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"                     # 调试用；正式入口走 nginx
    environment:
      GIN_MODE: release
      MYSQL_DSN: "acp:${MYSQL_PASSWORD:-acp123}@tcp(mysql:3306)/acp?charset=utf8mb4&parseTime=True&loc=Local"
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: "amqp://acp:${RABBITMQ_PASSWORD:-acp}@rabbitmq:5672/"
      AI_GRPC_ADDR: ai-engine:50051
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      FEISHU_ADAPTER_TOKEN: ${FEISHU_ADAPTER_TOKEN:-dev-feishu-internal-token}
      RATE_LIMIT_PER_DAY: ${RATE_LIMIT_PER_DAY:-20}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-acpadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-acpadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-acp-docs}
      MAX_FILE_SIZE_MB: "10"
      MAX_FILES: "5"
      MAX_TOTAL_MB: "30"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  # ─────────────────── AI 引擎层：Python（自建） ───────────────────
  ai-engine:
    build: ./ai-engine
    image: acp-ai-engine
    container_name: acp-ai-engine
    restart: unless-stopped
    ports:
      - "8000:8000"                     # /health /metrics
      - "50051:50051"                   # gRPC（网关调用，暴露便于调试）
    volumes:
      - ./ai-engine/data/docs:/app/data/docs   # 课程知识库文档，管理员可 /admin/reindex 重灌
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?DASHSCOPE_API_KEY must be set in .env}
      LLM_MODEL: ${LLM_MODEL:-qwen-plus}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      QDRANT_URL: http://qdrant:6333
      RAG_COLLECTION: ${RAG_COLLECTION:-acp_docs}
      RERANK_ENABLED: ${RERANK_ENABLED:-true}
      MEMORY_COLLECTION: ${MEMORY_COLLECTION:-mem0}
      MEMORY_EMBED_DIM: "2048"
      MCP_SERVER_URL: ${MCP_SERVER_URL:-https://dashscope.aliyuncs.com/api/v1/mcps/WebSearch/mcp}
      MAX_AGENT_ITERS: ${MAX_AGENT_ITERS:-8}
      DOCS_DIR: /app/data/docs
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: "amqp://acp:${RABBITMQ_PASSWORD:-acp}@rabbitmq:5672/"
      VISION_MODEL: ${VISION_MODEL:-qwen3-vl-plus}
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ─────────────────── AI 异步 worker（文档解析） ───────────────────
  ai-worker:
    build: ./ai-engine
    image: acp-ai-engine
    container_name: acp-ai-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?DASHSCOPE_API_KEY must be set in .env}
      RABBITMQ_URL: "amqp://acp:${RABBITMQ_PASSWORD:-acp}@rabbitmq:5672/"
      REDIS_ADDR: redis:6379
      VISION_MODEL: ${VISION_MODEL:-qwen3-vl-plus}
    depends_on:
      ai-engine:
        condition: service_started    # ingest 任务经 gRPC 写知识库，需 ai-engine 在线
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ─────────────────── 飞书适配器（新渠道：飞书机器人，自建） ───────────────────
  feishu-adapter:
    build: ./feishu-adapter
    image: acp-feishu-adapter
    container_name: acp-feishu-adapter
    restart: unless-stopped
    environment:
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_ADAPTER_TOKEN: ${FEISHU_ADAPTER_TOKEN:-dev-feishu-internal-token}
      GATEWAY_URL: http://gateway:8080
    depends_on:
      gateway:
        condition: service_started

  # ─────────────────── 关系库：MySQL ───────────────────
  mysql:
    image: mysql:8.0
    container_name: acp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: acp
      MYSQL_USER: acp
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-acp123}
    ports:
      - "3307:3306"   # 宿主机 3306 被本机 mysqld 占用，改映射到 3307
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────── 缓存 / 限流 / 黑名单 / 解析结果：Redis ───────────────────
  redis:
    image: redis:7-alpine
    container_name: acp-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────── 消息队列：RabbitMQ ───────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: acp-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: acp
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-acp}
    ports:
      - "5672:5672"                     # AMQP
      - "15672:15672"                   # 管理台（调试/演示）
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────── 向量库：Qdrant（课程库 + 长期记忆共用） ───────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: acp-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"                     # REST
      - "6334:6334"                     # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  # ─────────────────── 附件对象存储：MinIO ───────────────────
  minio:
    image: minio/minio:latest
    container_name: acp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-acpadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-acpadmin123}
    ports:
      - "9000:9000"                     # S3 API
      - "9001:9001"                     # 控制台
    volumes:
      - minio_data:/data

  # ─────────────────── 监控：Prometheus + Grafana（常开） ───────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: acp-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - gateway
      - ai-engine

  grafana:
    image: grafana/grafana:10.4.0
    container_name: acp-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana

  # ─────────────────── 反向代理（唯一对外入口）：Nginx ───────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: acp-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8081}:80"      # 本地默认 8081；生产 .env 设 80
      - "${NGINX_HTTPS_PORT:-8443}:443"    # 本地默认 8443；生产 .env 设 443
    volumes:
      - ${NGINX_CONF_PATH:-./deploy/nginx.dev.conf}:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/certs:/etc/nginx/certs:ro   # TLS 证书目录（生产生成；本地可为空）
      - ./deploy/certbot/www:/var/www/certbot:ro   # ACME HTTP-01 验证目录
    depends_on:
      - gateway

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  qdrant_data:
  minio_data:
  grafana_data:
